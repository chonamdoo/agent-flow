# 자격 증명은 실행 시 읽기 전용으로만 들어온다. 이미지에는 없다.
# Codex는 ~/.codex에 세션 기록을 써야 하므로 auth.json 파일만 mount한다.
x-auth: &auth
  volumes:
    - ${CODEX_AUTH_JSON:-${HOME}/.codex/auth.json}:/home/eval/.codex/auth.json:ro
    - ${CLAUDE_CREDENTIALS_JSON:-${HOME}/.claude/.credentials.json}:/home/eval/.claude/.credentials.json:ro

services:
  phase_eval:
    <<: *auth
  ui_task:
    <<: *auth
