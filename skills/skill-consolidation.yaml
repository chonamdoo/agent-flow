# Candidate groups from adversarial review. These are aliases until each
# replacement has a golden prompt/marker replay; no runtime auto-merge occurs.
groups:
  - canonical: clean-presentation-architecture
    candidates:
      - ios-clean-presentation-architecture
      - react-clean-presentation-architecture
      - react-native-clean-presentation-architecture
    policy: keep-platform-adapters, share references only
  - canonical: app-shell-error-handling
    candidates:
      - android-appshell-error-handling
      - ios-app-shell-error-handling
      - react-app-shell-error-handling
      - react-native-app-shell-error-handling
