  - canonical: clean-architecture
    candidates:
      - ios-clean-architecture
      - react-clean-architecture
      - react-native-clean-architecture
      - python-api-clean-architecture
    policy: preserve platform-specific forbidden-dependency rules
  - canonical: matt-pocock-planning
    candidates:
