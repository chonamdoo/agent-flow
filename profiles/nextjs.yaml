id: nextjs
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: optional
gates:
  - id: context-lint
    command: "node scripts/check-context-docs.mjs"
    required: true
    phase: pre-commit
  - id: build
    command: "npm run build"
    required: true
    phase: pre-push
  - id: test
    command: "npm test"
    required: true
    phase: pre-commit
  - id: lint
    command: "npm run lint"
    required: false
    phase: pre-commit
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: render-stability
    prompt: templates/_shared/review/render-stability.md
  - id: a11y
    prompt: templates/_shared/review/a11y.md
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
  lore: notes
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
