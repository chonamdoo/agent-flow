id: android
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: architecture-lint
    command: ["./.agent-flow/bin/agent-flow", "architecture-lint", "--profile", "android"]
    required: true
    phase: pre-commit
  - id: build
    command: ["./gradlew", "assembleDevDebug"]
    required: true
    phase: pre-push
  - id: test
    command: ["./gradlew", "test"]
    required: true
    phase: pre-commit
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: android-skills
    prompt: templates/_shared/review/android-skills.md
  - id: compose-stability
    prompt: templates/_shared/review/compose-stability.md
  - id: test-edge
    prompt: templates/_shared/review/test-edge.md
skills:
  install:
    - android-appshell-error-handling
    - android-clean-architecture
    - android-clean-presentation-architecture
    - android-code-review
    - android-guides
    - android-intent-security
    - android-debugging
    - android-module-creator
    - android-mvi-feature
    - adaptive
    - agp-9-upgrade
    - android-cli
    - camera1-to-camerax
    - compose-animations
    - compose-focus-navigation
    - compose-modifier-and-layout-style
    - compose-recomposition-performance
    - compose-side-effects
    - compose-slot-api-pattern
    - compose-stability-diagnostics
    - compose-state-authoring
    - compose-state-deferred-reads
    - compose-state-hoisting
    - compose-state-holder-ui-split
    - compose-ui-testing-patterns
    - display-glasses-with-jetpack-compose-glimmer
    - edge-to-edge
    - engage-sdk-integration
    - jetpack-compose-m3
    - kotlin-coroutines-structured-concurrency
    - kotlin-flow-state-event-modeling
    - kotlin-multiplatform-expect-actual
    - kotlin-types-value-class
    - migrate-xml-views-to-jetpack-compose
    - navigation-3
    - perfetto-sql
    - perfetto-trace-analysis
    - play-billing-library-version-upgrade
    - play-policy-insights
    - r8-analyzer
    - styles
    - testing-localization
    - testing-setup
    - verified-email
    - appfunctions
  required_review:
    - group: profile
      skills: [android-code-review, android-clean-architecture]
      when: Android/Kotlin/Compose/KMP files or Android profile architecture roles change
      missing: "missing local profile: <skill>"
    - group: android_skills
      skills_from: android_skills.review
      when: Android review scope matches an android_skills.review entry
      missing: "missing local android_skills: <skill>"
    - group: android_ecosystem_skills
      skills_from: android_ecosystem_skills.review
      when: Android review scope matches an android_ecosystem_skills.review entry
      missing: "missing local android_ecosystem_skills: <skill>"
    - group: chrisbanes_skills
      skills_from: chrisbanes_skills.review
      when: Compose/Kotlin/KMP review scope matches a chrisbanes_skills.review entry
      missing: "missing local chrisbanes_skills: <skill>"
architecture:
  contract: clean-architecture-core
  platform: android
  roles:
    - id: app-shell
      paths: ["app", "android/app"]
      modules: [":app"]
      forbidden: ["ApiService", "RemoteDataSource", "Dto", "Entity"]
    - id: core-domain
      paths: ["core/domain/<context>"]
      modules: [":core:domain:<context>"]
      package_suffix: "core.domain.<context>"
      pair_with: core-data
      forbidden: ["ApiService", "RemoteDataSource", "Dto", "@Composable", "ViewModel"]
    - id: core-data
      paths: ["core/data/<context>"]
      modules: [":core:data:<context>"]
      package_suffix: "core.data.<context>"
      pair_with: core-domain
      forbidden: ["@Composable", "ViewModel"]
    - id: feature-api
      paths: ["feature/<feature>/api"]
      modules: [":feature:<feature>:api"]
      package_suffix: "feature.<feature>.api"
      pair_with: feature-presentation
      forbidden: ["Screen", "ViewModel", "RepositoryImpl", "RemoteDataSource", "ApiService"]
    - id: feature-presentation
      paths: ["feature/<feature>/presentation"]
      modules: [":feature:<feature>:presentation"]
      package_suffix: "feature.<feature>.presentation"
      pair_with: feature-api
      forbidden: ["ApiService", "RemoteDataSource", "Dto", "Entity"]
    - id: core-design-system
      paths: ["core/designsystem"]
      modules: [":core:designsystem"]
      package_suffix: "core.designsystem"
    - id: core-ui
      paths: ["core/ui"]
      modules: [":core:ui"]
      package_suffix: "core.ui"
    - id: core-resources
      paths: ["core/resources"]
      modules: [":core:resources"]
      package_suffix: "core.resources"
    - id: core-network
      paths: ["core/network"]
      modules: [":core:network"]
      package_suffix: "core.network"
    - id: core-platform
      paths: ["core/platform"]
      modules: [":core:platform"]
      package_suffix: "core.platform"
    - id: core-platform-adapter
      paths: ["core/platform/<adapter>"]
      modules: [":core:platform:<adapter>"]
      package_suffix: "core.platform.<adapter>"
    - id: core-permission
      paths: ["core/permission"]
      modules: [":core:permission"]
      package_suffix: "core.permission"
    - id: navigation-api
      paths: ["core/navigation/api"]
      modules: [":core:navigation:api"]
      package_suffix: "core.navigation.api"
    - id: navigation-impl
      paths: ["core/navigation/impl"]
      modules: [":core:navigation:impl"]
      package_suffix: "core.navigation.impl"
android_skills:
  source: https://github.com/android/skills
  install_policy: project_snapshot
  active_host_only: false
  load_mode: indexed_snapshot
  bootstrap_hosts:
    codex: ~/.codex/skills/{skill}/SKILL.md
    claude: ~/.claude/skills/{skill}/SKILL.md
    omp: ~/.omp/agent/skills/{skill}/SKILL.md
  load_policy:
    - install 시 project-owned snapshot 권위를 유지하고, fresh external source는 active host, shared, bundled, other host 순으로 whole-tree snapshot을 고정한다.
    - 실행 중에는 `.agent-flow/skills/index.json`이 가리키는 project snapshot만 읽는다.
    - required skill을 해석할 수 없으면 `missing local android_skills: <skill>`로 fail한다.
  implementation:
    - skill: agp-9-upgrade
      when: Android Gradle Plugin 9, built-in Kotlin, new AGP DSL, kapt, KSP, or AGP 9 BuildConfig migration work
    - skill: android-intent-security
      when: Android exported components, incoming or nested Intents, PendingIntent, receivers, services, providers, or Intent redirection security work
    - skill: play-policy-insights
      when: Google Play policy, Data Safety, restricted permissions, account deletion, demo credentials, privacy disclosure, or pre-submission compliance work
    - skill: edge-to-edge
      when: system bars, insets, edge-to-edge, status bar, navigation bar, or cutout behavior changes
    - skill: adaptive
      when: Compose adaptive layout, window size classes, foldables, tablets, or responsive UI changes
    - skill: navigation-3
      when: Jetpack Navigation 3, back stack, or navigation migration work
    - skill: testing-setup
      when: Android test setup, Gradle test dependencies, instrumentation, Robolectric, or missing test scaffolding changes
    - skill: camera1-to-camerax
      when: Camera1, Camera2, or CameraX migration work
    - skill: r8-analyzer
      when: R8, shrinker, minification, obfuscation, mapping, or release size work
    - skill: perfetto-trace-analysis
      when: Perfetto trace, startup, jank, frame timing, or system performance analysis
    - skill: perfetto-sql
      when: Perfetto SQL query or trace metric work
    - skill: play-billing-library-version-upgrade
      when: Play Billing Library upgrade work
    - skill: engage-sdk-integration
      when: Google Play Engage SDK integration work
    - skill: verified-email
      when: verified email or identity API work
    - skill: appfunctions
      when: Android app functions or device AI integration work
    - skill: android-cli
      when: Android CLI tooling, adb, emulator, sdkmanager, or command-line build setup changes
    - skill: migrate-xml-views-to-jetpack-compose
      when: Android XML view migration to Jetpack Compose changes
    - skill: styles
      when: Jetpack Compose Styles API integration changes
    - skill: display-glasses-with-jetpack-compose-glimmer
      when: Android XR display glasses or Compose Glimmer work
    - skill: jetpack-compose-m3
      when: Wear OS Compose Material 3 or watch UI work
  review:
    - skill: agp-9-upgrade
      when: reviewing an AGP 9 migration, built-in Kotlin, new DSL, kapt or KSP, BuildConfig, or Gradle compatibility changes
    - skill: android-intent-security
      when: reviewing exported components, incoming Intents, PendingIntent mutability, caller verification, receivers, services, or providers
    - skill: play-policy-insights
      when: reviewing Play policy readiness, Data Safety declarations, restricted permissions, privacy disclosures, account deletion, or demo credentials
    - skill: edge-to-edge
      when: reviewing system bars, insets, fullscreen, or edge-to-edge behavior
    - skill: adaptive
      when: reviewing Compose adaptive UI, tablets, foldables, or responsive layout
    - skill: navigation-3
      when: reviewing navigation graph, back stack, or Navigation 3 migration
    - skill: testing-setup
      when: reviewing Android test coverage, test setup, or missing tests
    - skill: r8-analyzer
      when: reviewing release shrinker, R8, mapping, or app size risk
    - skill: perfetto-trace-analysis
      when: reviewing performance fixes backed by Perfetto traces
    - skill: migrate-xml-views-to-jetpack-compose
      when: reviewing XML view migration to Jetpack Compose
    - skill: styles
      when: reviewing Jetpack Compose Styles API integration
    - skill: jetpack-compose-m3
      when: reviewing Wear OS Compose Material 3 or watch UI
android_ecosystem_skills:
  source: project-vendored-ecosystem
  install_policy: project_snapshot
  active_host_only: false
  load_mode: indexed_snapshot
  load_policy:
    - Android 공식 upstream catalog와 분리하며 설치 집합은 유지한다.
    - 실행 중에는 `.agent-flow/skills/index.json`이 가리키는 project snapshot만 읽는다.
    - required skill을 해석할 수 없으면 `missing local android_ecosystem_skills: <skill>`로 fail한다.
  implementation:
    - skill: testing-localization
      when: Android localization resources or locale test coverage changes
  review:
    - skill: testing-localization
      when: reviewing localization resources or locale test coverage
chrisbanes_skills:
  source: https://github.com/chrisbanes/skills/tree/main/skills
  install_policy: project_snapshot
  active_host_only: false
  load_mode: indexed_snapshot
  bootstrap_hosts:
    codex: ~/.codex/skills/{skill}/SKILL.md
    claude: ~/.claude/skills/{skill}/SKILL.md
    omp: ~/.omp/agent/skills/{skill}/SKILL.md
  load_policy:
    - install 시 project-owned snapshot 권위를 유지하고, fresh external source는 active host, shared, bundled, other host 순으로 whole-tree snapshot을 고정한다.
    - 실행 중에는 `.agent-flow/skills/index.json`이 가리키는 project snapshot만 읽는다.
    - required skill을 해석할 수 없으면 `missing local chrisbanes_skills: <skill>`로 fail한다.
  implementation:
    - skill: android-mvi-feature
      when: Compose screen, ViewModel state, or MVI action work
    - skill: android-module-creator
      when: Android module or Gradle boundary work
    - skill: android-debugging
      when: crash, race, recomposition, or failing test diagnosis
    - skill: compose-state-authoring
      when: local Compose state, remember, or state accessors change
    - skill: compose-state-hoisting
      when: deciding local state vs hoisted state vs state holder
    - skill: compose-state-holder-ui-split
      when: screen state holder and plain UI split changes
    - skill: compose-side-effects
      when: LaunchedEffect, DisposableEffect, event Flow, navigation, snackbar, or analytics changes
    - skill: compose-recomposition-performance
      when: recomposition, jank, stability, or deferred read work
    - skill: compose-stability-diagnostics
      when: Compose stability, strong skipping, or compiler reports are relevant
    - skill: compose-state-deferred-reads
      when: scroll, animation, gesture, or frame-rate state is read
    - skill: compose-modifier-and-layout-style
      when: modifier APIs, layout APIs, or caller-placeable components change
    - skill: compose-slot-api-pattern
      when: reusable Compose component slots change
    - skill: compose-animations
      when: Compose animation APIs or transitions change
    - skill: compose-focus-navigation
      when: keyboard, TV, D-pad, or accessibility focus changes
    - skill: compose-ui-testing-patterns
      when: Compose UI tests, semantics, focus tests, or screenshot tests change
    - skill: kotlin-coroutines-structured-concurrency
      when: CoroutineScope, launch, cancellation, blocking, or suspend boundaries change
    - skill: kotlin-flow-state-event-modeling
      when: StateFlow, SharedFlow, Channel, stateIn, or one-shot events change
    - skill: kotlin-multiplatform-expect-actual
      when: KMP expect/actual or platform boundary changes
    - skill: kotlin-types-value-class
      when: single-field domain types or Compose-stable value types change
  review:
    - skill: compose-state-authoring
      when: Compose state changed
    - skill: compose-state-hoisting
      when: state ownership changed
    - skill: compose-state-holder-ui-split
      when: screen state holder or UI split changed
    - skill: compose-side-effects
      when: Compose effects or event collection changed
    - skill: compose-recomposition-performance
      when: recomposition, jank, or stability risk exists
    - skill: compose-stability-diagnostics
      when: stable/unstable parameters or skipping behavior changed
    - skill: compose-state-deferred-reads
      when: frame-rate state reads changed
    - skill: compose-modifier-and-layout-style
      when: modifiers or layout APIs changed
    - skill: compose-slot-api-pattern
      when: slot APIs changed
    - skill: compose-animations
      when: animations changed
    - skill: compose-focus-navigation
      when: focus behavior changed
    - skill: compose-ui-testing-patterns
      when: Compose UI tests changed or are missing
    - skill: kotlin-coroutines-structured-concurrency
      when: coroutine ownership or cancellation risk exists
    - skill: kotlin-flow-state-event-modeling
      when: Flow state or event modeling changed
    - skill: kotlin-multiplatform-expect-actual
      when: KMP boundaries changed
    - skill: kotlin-types-value-class
      when: value classes or single-field domain types changed
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: PRD
  adr: ADR
  lore: lore
commit_convention:
  style: tagged          # [Feat] / [Fix] / [Refactor] / ...
  co_author: skip
pr:
  target_branch: main
  merge_strategy: merge
