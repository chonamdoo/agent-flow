id: android
branching:
  strategy: release-first
  base: release/*        # 활성 release/YY.M.D.x 브랜치, 운영자가 확인
  integration: release/* # PR은 활성 release 브랜치로 보내고 이후 develop에 동기화
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: context-lint
    command: ["node", "scripts/check-context-docs.mjs"]
    required: true
    phase: pre-commit
  - id: build
    command: ["./gradlew", "assembleDevDebug"]
    required: true
    phase: pre-push
  - id: test
    command: ["./gradlew", "test"]
    required: true
    phase: pre-commit
  - id: lint
    command: ["./gradlew", "lint"]
    required: false
    phase: pre-commit
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: android-skills
    prompt: templates/_shared/review/android-skills.md
  - id: compose-stability
    prompt: templates/_shared/review/compose-stability.md
  - id: test-edge
    prompt: templates/_shared/review/test-edge.md
android_skills:
  source: https://github.com/android/skills
  vendor_dir: .agent-flow/vendor/android-skills
  native_loader: false
  hosts:
    - codex
    - claude
    - antigravity
  search_paths:
    - .agent-flow/vendor/android-skills/{skill}/SKILL.md
  load_policy:
    - Android/Kotlin/Compose/KMP 개발 또는 코드 리뷰 전 변경 영역과 맞는 upstream skill을 plain text로 읽는다.
    - Codex/Claude/Antigravity native skill directory에는 upstream Android skill을 복사하거나 링크하지 않는다.
    - "`.agent-flow/vendor/android-skills/` 단일 vendor copy를 공통 참조해 host별 중복 노출을 막는다."
    - 맞는 항목이 없거나 파일이 없으면 `no matching android_skills: <reason>`로 기록하고 계속 진행한다.
  implementation:
    - skill: system/edge-to-edge
      when: system bars, insets, edge-to-edge, status bar, navigation bar, or cutout behavior changes
    - skill: jetpack-compose/adaptive
      when: Compose adaptive layout, window size classes, foldables, tablets, or responsive UI changes
    - skill: navigation/navigation-3
      when: Jetpack Navigation 3, back stack, or navigation migration work
    - skill: testing/testing-setup
      when: Android test setup, Gradle test dependencies, instrumentation, Robolectric, or missing test scaffolding changes
    - skill: camera/camera1-to-camerax
      when: Camera1, Camera2, or CameraX migration work
    - skill: performance/r8-analyzer
      when: R8, shrinker, minification, obfuscation, mapping, or release size work
    - skill: profilers/perfetto-trace-analysis
      when: Perfetto trace, startup, jank, frame timing, or system performance analysis
    - skill: profilers/perfetto-sql
      when: Perfetto SQL query or trace metric work
    - skill: play/play-billing-library-version-upgrade
      when: Play Billing Library upgrade work
    - skill: play/engage-sdk-integration
      when: Google Play Engage SDK integration work
    - skill: identity/verified-email
      when: verified email or identity API work
    - skill: device-ai/appfunctions
      when: Android app functions or device AI integration work
    - skill: devtools/android-cli
      when: Android CLI tooling, adb, emulator, sdkmanager, or command-line build setup changes
    - skill: xr/display-glasses-with-jetpack-compose-glimmer
      when: Android XR display glasses or Compose Glimmer work
  review:
    - skill: system/edge-to-edge
      when: reviewing system bars, insets, fullscreen, or edge-to-edge behavior
    - skill: jetpack-compose/adaptive
      when: reviewing Compose adaptive UI, tablets, foldables, or responsive layout
    - skill: navigation/navigation-3
      when: reviewing navigation graph, back stack, or Navigation 3 migration
    - skill: testing/testing-setup
      when: reviewing Android test coverage, test setup, or missing tests
    - skill: performance/r8-analyzer
      when: reviewing release shrinker, R8, mapping, or app size risk
    - skill: profilers/perfetto-trace-analysis
      when: reviewing performance fixes backed by Perfetto traces
chrisbanes_skills:
  source: https://github.com/chrisbanes/skills/tree/main/skills
  vendor_dir: .agent-flow/vendor/chrisbanes-skills/skills
  native_loader: false
  search_paths:
    - ~/.codex/skills/{skill}/SKILL.md
    - ~/.claude/skills/{skill}/SKILL.md
    - ~/.agents/skills/{skill}/SKILL.md
    - .agent-flow/vendor/chrisbanes-skills/skills/{skill}/SKILL.md
  load_policy:
    - Android/Kotlin/Compose/KMP 개발 또는 코드 리뷰 전 변경 영역과 맞는 chrisbanes skill을 plain text로 읽는다.
    - host native skill directory에 이미 설치된 경우에도 다른 host 경로를 중복 로드하지 않는다.
    - "native 경로에 없거나 일부 host에서 누락되면 `.agent-flow/vendor/chrisbanes-skills/skills/`를 fallback으로 읽는다."
    - 파일이 없거나 읽을 수 없으면 `no matching chrisbanes_skills: <reason>`로 기록하고 계속 진행한다.
  implementation:
    - skill: android-mvi-feature
      when: Compose screen, ViewModel state, or MVI action work
    - skill: android-module-creator
      when: Android module or Gradle boundary work
    - skill: android-debugging
      when: crash, race, recomposition, or failing test diagnosis
    - skill: compose-state-authoring
      when: local Compose state, remember, or state accessors change
    - skill: compose-state-hoisting
      when: deciding local state vs hoisted state vs state holder
    - skill: compose-state-holder-ui-split
      when: screen state holder and plain UI split changes
    - skill: compose-side-effects
      when: LaunchedEffect, DisposableEffect, event Flow, navigation, snackbar, or analytics changes
    - skill: compose-recomposition-performance
      when: recomposition, jank, stability, or deferred read work
    - skill: compose-stability-diagnostics
      when: Compose stability, strong skipping, or compiler reports are relevant
    - skill: compose-state-deferred-reads
      when: scroll, animation, gesture, or frame-rate state is read
    - skill: compose-modifier-and-layout-style
      when: modifier APIs, layout APIs, or caller-placeable components change
    - skill: compose-slot-api-pattern
      when: reusable Compose component slots change
    - skill: compose-animations
      when: Compose animation APIs or transitions change
    - skill: compose-focus-navigation
      when: keyboard, TV, D-pad, or accessibility focus changes
    - skill: compose-ui-testing-patterns
      when: Compose UI tests, semantics, focus tests, or screenshot tests change
    - skill: kotlin-coroutines-structured-concurrency
      when: CoroutineScope, launch, cancellation, blocking, or suspend boundaries change
    - skill: kotlin-flow-state-event-modeling
      when: StateFlow, SharedFlow, Channel, stateIn, or one-shot events change
    - skill: kotlin-multiplatform-expect-actual
      when: KMP expect/actual or platform boundary changes
    - skill: kotlin-types-value-class
      when: single-field domain types or Compose-stable value types change
  review:
    - skill: android-code-review
      when: any Android/Kotlin/Compose/KMP diff
    - skill: compose-state-authoring
      when: Compose state changed
    - skill: compose-state-hoisting
      when: state ownership changed
    - skill: compose-state-holder-ui-split
      when: screen state holder or UI split changed
    - skill: compose-side-effects
      when: Compose effects or event collection changed
    - skill: compose-recomposition-performance
      when: recomposition, jank, or stability risk exists
    - skill: compose-stability-diagnostics
      when: stable/unstable parameters or skipping behavior changed
    - skill: compose-state-deferred-reads
      when: frame-rate state reads changed
    - skill: compose-modifier-and-layout-style
      when: modifiers or layout APIs changed
    - skill: compose-slot-api-pattern
      when: slot APIs changed
    - skill: compose-animations
      when: animations changed
    - skill: compose-focus-navigation
      when: focus behavior changed
    - skill: compose-ui-testing-patterns
      when: Compose UI tests changed or are missing
    - skill: kotlin-coroutines-structured-concurrency
      when: coroutine ownership or cancellation risk exists
    - skill: kotlin-flow-state-event-modeling
      when: Flow state or event modeling changed
    - skill: kotlin-multiplatform-expect-actual
      when: KMP boundaries changed
    - skill: kotlin-types-value-class
      when: value classes or single-field domain types changed
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: PRD
  adr: ADR
  lore: lore
commit_convention:
  style: tagged          # [Feat] / [Fix] / [Refactor] / ...
  co_author: skip
pr:
  target_branch: release/*
  merge_strategy: merge
