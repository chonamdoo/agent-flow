id: ios
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: optional
gates:
  - id: context-lint
    command: "python3 scripts/check_context_docs.py"
    required: true
    phase: pre-commit
  - id: build
    command: "xcodebuild -scheme App -destination 'platform=iOS Simulator,name=iPhone 15' build"
    required: true
    phase: pre-push
  - id: test
    command: "xcodebuild -scheme App -destination 'platform=iOS Simulator,name=iPhone 15' test"
    required: true
    phase: pre-push
  - id: lint
    command: "swiftlint"
    required: false
    phase: pre-commit
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: retain-cycles
    prompt: templates/_shared/review/retain-cycles.md
  - id: main-thread
    prompt: templates/_shared/review/main-thread.md
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
  lore: notes
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
