id: node
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: architecture-lint
    command: ["agent-flow", "architecture-lint", "--profile", "node"]
    required: true
    phase: pre-commit
  - id: test
    command: ["npm", "test"]
    required: true
    phase: pre-push
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: types
    prompt: templates/_shared/review/types.md
  - id: io-safety
    prompt: templates/_shared/review/io-safety.md
skills:
  install:
    - typescript-development-guide
  required_review:
    - group: profile
      skills: [typescript-development-guide]
      when: Node/JavaScript/TypeScript files change
      missing: "missing local profile: <skill>"
architecture:
  contract: clean-architecture-core
  platform: node
  strict_when_roots_present: true
  activation_roots: ["src", "lib", "app"]
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
  lore: notes
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
