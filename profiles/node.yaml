id: node
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: architecture-lint
    command: ["./.agent-flow/bin/agent-flow", "architecture-lint", "--profile", "node"]
    required: true
    phase: pre-commit
  - id: test
    command: ["npm", "test"]
    required: true
    phase: pre-push
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: types
    prompt: templates/_shared/review/types.md
  - id: io-safety
    prompt: templates/_shared/review/io-safety.md
skills:
  install:
    - node-development-guide
    - typescript-development-guide
  required_review:
    - group: profile
      skills: [node-development-guide]
      when: Node.js service, CLI, or tooling files change
      missing: "missing local profile: <skill>"
    - group: typescript_skills
      skills_from: typescript_skills.review
      when: Node.js TypeScript files, tsconfig, or TypeScript task scope changes
      missing: "missing local typescript_skills: <skill>"
typescript_skills:
  implementation:
    - skill: typescript-development-guide
      when: Node.js TypeScript files, tsconfig, or TypeScript task scope changes
  review:
    - skill: typescript-development-guide
      when: reviewing Node.js TypeScript files, tsconfig, or TypeScript task scope
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
  lore: notes
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
