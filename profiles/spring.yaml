id: spring
branching:
  strategy: gitflow
  base: develop
  integration: develop
  worktree: optional
gates:
  - id: context-lint
    command: "node scripts/check-context-docs.mjs"
    required: true
    phase: pre-commit
  - id: build
    command: "./gradlew build -x test"
    required: true
    phase: pre-commit
  - id: test
    command: "./gradlew test"
    required: true
    phase: pre-push
  - id: lint
    command: "./gradlew check"
    required: false
    phase: pre-commit
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: transactions
    prompt: templates/_shared/review/transactions.md
  - id: n-plus-one
    prompt: templates/_shared/review/n-plus-one.md
artifacts:
  prd: optional
  adr: required        # Spring backends benefit from explicit decision logs
  slice_plan: required
vocabulary:
  prd: spec
  adr: ADR
  lore: notes
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: develop
  merge_strategy: merge
