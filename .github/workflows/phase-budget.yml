name: Phase budget

# 테스트 스위트와 따로, 병렬로 돈다. PR의 base kit과 head kit에 `evals/phase_budget.py`를
# 각각 돌려(모델 호출 없음, 결정적) phase별 필수 skill과 프롬프트 바이트를 비교한다.
# 판정 기준은 maintainer/verification-policy.md의 "phase skill 전달 회귀 평가"다.
# 의도한 변화면 PR 본문에 이유를 적고 `phase-budget-accepted` 라벨을 붙인다. 그러면 같은
# 보고를 남기되 실패하지 않는다.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "src/agent_flow/**"
      - "skills/**"
      - "templates/**"
      - "bootstrap/**"
      - "bin/**"
      - "lib/**"
      - "evals/phase_budget.py"
      - "evals/phase_budget_compare.py"
      - ".github/workflows/phase-budget.yml"

permissions:
  contents: read

jobs:
  measure:
    name: phase_budget ${{ matrix.kit }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kit: [base, head]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # 측정 스크립트는 head 것을 쓰고, 측정 대상 kit만 base/head 커밋의 트리로 바꾼다.
      - name: Extract the kit under measurement
        env:
          REF: ${{ matrix.kit == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/kit"
          git archive "$REF" | tar -x -C "$RUNNER_TEMP/kit"
      - name: Measure
        env:
          AGENT_FLOW_SKIP_CODEX_TRUST: "1"
          AGENT_FLOW_NO_UPDATE_CHECK: "1"
        run: python evals/phase_budget.py --kit "$RUNNER_TEMP/kit" --jobs 4 --output "budget-${{ matrix.kit }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: budget-${{ matrix.kit }}
          path: budget-${{ matrix.kit }}.json
          retention-days: 14

  compare:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: budget-*
          merge-multiple: true
      - name: Compare base and head
        env:
          ACCEPT: ${{ contains(github.event.pull_request.labels.*.name, 'phase-budget-accepted') && '--accept' || '' }}
        run: python evals/phase_budget_compare.py budget-base.json budget-head.json --summary "$GITHUB_STEP_SUMMARY" $ACCEPT
