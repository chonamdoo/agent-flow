name: v0.3.15 Homebrew deployment smoke

on:
  workflow_dispatch:
    inputs:
      pytest_k:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  homebrew-upgrade:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      GH_TOKEN: ${{ github.token }}
      AGENT_FLOW_NO_UPDATE_CHECK: "1"
      AGENT_FLOW_SKIP_CODEX_TRUST: "1"
    steps:
      - name: Verify ARM Homebrew runtime
        run: |
          test "$(uname -m)" = arm64
          test "$(brew --prefix)" = /opt/homebrew
      - name: Install the previously released version
        run: |
          gh auth setup-git --hostname github.com
          brew tap chonamdoo/agent-flow https://github.com/chonamdoo/agent-flow.git
          tap=$(brew --repo chonamdoo/agent-flow)
          git -C "$tap" fetch origin 1347e820aa88195555fdc56a36f00661f4481837
          git -C "$tap" checkout --detach FETCH_HEAD
          source_url=https://github.com/chonamdoo/agent-flow/archive/refs/tags/v0.3.14.tar.gz
          checksum=$(sed -n 's/^  sha256 "\([a-f0-9]*\)".*/\1/p' "$tap/Formula/agent-flow.rb" | head -n 1)
          test "${#checksum}" = 64
          archive="${RUNNER_TEMP}/agent-flow-v0.3.14.tar.gz"
          curl --fail --location --silent --show-error --header "Authorization: Bearer ${GH_TOKEN}" "$source_url" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 -c -
          source_cache=$(brew --cache chonamdoo/agent-flow/agent-flow)
          mkdir -p "$(dirname "$source_cache")"
          cp "$archive" "$source_cache"
          brew install chonamdoo/agent-flow/agent-flow
          test "$(agent-flow --version)" = 'agent-flow 0.3.14'
      - name: Upgrade to the released v0.3.15 formula
        run: |
          tap=$(brew --repo chonamdoo/agent-flow)
          git -C "$tap" fetch origin main
          git -C "$tap" checkout --detach origin/main
          source_url=https://github.com/chonamdoo/agent-flow/archive/refs/tags/v0.3.15.tar.gz
          checksum=$(sed -n 's/^  sha256 "\([a-f0-9]*\)".*/\1/p' "$tap/Formula/agent-flow.rb" | head -n 1)
          test "${#checksum}" = 64
          archive="${RUNNER_TEMP}/agent-flow-v0.3.15.tar.gz"
          curl --fail --location --silent --show-error --header "Authorization: Bearer ${GH_TOKEN}" "$source_url" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 -c -
          source_cache=$(brew --cache chonamdoo/agent-flow/agent-flow)
          mkdir -p "$(dirname "$source_cache")"
          cp "$archive" "$source_cache"
          brew upgrade chonamdoo/agent-flow/agent-flow
          test "$(agent-flow --version)" = 'agent-flow 0.3.15'
          brew test chonamdoo/agent-flow/agent-flow
      - name: Verify fresh project launcher and Python environment
        run: |
          project="${RUNNER_TEMP}/agent-flow-release-project"
          mkdir -p "$project"
          git -C "$project" init
          agent-flow "$project"
          test "$("$project/.agent-flow/bin/agent-flow" --version)" = 'agent-flow 0.3.15'
          expected=/opt/homebrew/opt/agent-flow/libexec/.venv/bin/python
          "$expected" -I -c 'import agent_flow, yaml, click; from agent_flow.core.profiles import load_profile_payload; assert not load_profile_payload("python").get("execution"); print("Published Python profile: no shipped reviewer model pin")'
          "$expected" -I - "$project/.agent-flow/kit.json" "$expected" <<'PY'
          import json, os, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          actual = data["project_launcher_python"]["path"]
          assert actual == sys.argv[2], (actual, sys.argv[2])
          assert os.path.samefile(actual, sys.argv[2]), (actual, sys.argv[2])
          print("Pinned launcher Python:", actual)
          print("Expected Homebrew Python:", sys.argv[2])
          PY
          printf 'import sys; print(sys.executable)\n' > "${RUNNER_TEMP}/probe.py"
          actual_hook=$("$project/.agent-flow/bin/agent-flow-hook" "${RUNNER_TEMP}/probe.py")
          "$expected" -I -c 'import os,sys; assert os.path.samefile(sys.argv[1], sys.argv[2]), sys.argv[1]' "$actual_hook" "$expected"
          printf 'Hook launcher Python: %s\n' "$actual_hook"
          printf '::notice title=Homebrew deployment verified::version=0.3.15; launcher=%s; hook=%s\n' "$expected" "$actual_hook"
