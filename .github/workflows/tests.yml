name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  # 전 스위트가 몇 분인지는 로컬 추정이 아니라 실측이어야 한다.
  # `gh workflow run tests.yml`로 아무 브랜치에서나 재볼 수 있게 열어 둔다.
  workflow_dispatch:
    inputs:
      pytest_k:
        description: "pytest -k expression (empty = full suite)"
        required: false
        default: ""

jobs:
  # 이 job이 없으면 테스트 스위트 전체가 로컬 자기신고다. 통과 여부를 저장소
  # 밖에서 판정하는 관측자는 CI뿐이다.
  pytest-shards:
    name: pytest shard ${{ matrix.shard }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # 35885695080은 worker 2개로 두 번 모두 30분 제한에 걸렸다.
    # 설치 테스트 파일 안의 개별 사례까지 나눠 특정 runner에 몰리지 않게 한다.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(inputs.pytest_k != '' && '[1]' || '[1,2,3,4]') }}
    env:
      SHARD_COUNT: ${{ inputs.pytest_k != '' && '1' || '4' }}
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      # 설치·hook·worktree 테스트가 node를 서브프로세스로 띄운다.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate skill-noop cases without model calls
        run: |
          node --test tools/skill-noop/run.test.mjs
          node tools/skill-noop/run.mjs --all --validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate host-smoke scenarios and fixtures without model calls
        run: python tools/host-smoke/run.py --validate
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: tests/fixtures/mixed-architecture/package.json
      - name: Install mixed architecture fixture dependencies
        working-directory: tests/fixtures/mixed-architecture
        run: pnpm install --frozen-lockfile
      - name: Verify complete and disjoint test partitions
        if: matrix.shard == 1
        env:
          PYTHONPATH: src
          PYTEST_K: ${{ inputs.pytest_k }}
          AGENT_FLOW_SKIP_CODEX_TRUST: "1"
          AGENT_FLOW_NO_UPDATE_CHECK: "1"
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          command = [
              sys.executable, "-m", "pytest", "tests", "--collect-only", "-q",
              "-p", "no:cacheprovider", "-o", "addopts=", "--color=no", "-n", "0",
          ]
          if os.environ["PYTEST_K"]:
              command.extend(["-k", os.environ["PYTEST_K"]])

          def collect(arguments):
              result = subprocess.run(command + arguments, capture_output=True, text=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr, file=sys.stderr)
                  result.check_returncode()
              nodes = [
                  line for line in result.stdout.splitlines()
                  if line.startswith("tests/") and "::" in line
              ]
              if not nodes or len(nodes) != len(set(nodes)):
                  raise RuntimeError("Test collection is empty or contains duplicate node IDs")
              return set(nodes)

          expected = collect([])
          observed = set()
          counts = []
          for group in range(1, int(os.environ["SHARD_COUNT"]) + 1):
              nodes = collect([
                  "--splits", os.environ["SHARD_COUNT"], "--group", str(group),
                  "--splitting-algorithm", "least_duration",
              ])
              if observed & nodes:
                  raise RuntimeError("Test partitions overlap")
              observed.update(nodes)
              counts.append(len(nodes))
          if observed != expected:
              raise RuntimeError("Test partitions do not cover the selected suite")
          print(json.dumps({"selected": len(expected), "partitions": counts, "complete": True}))
          PY
      # 기본은 전 스위트다. package.json의 `test`는 일부만 돌려서 CI 기준으로 쓸 수
      # 없다. workflow_dispatch에서 pytest_k를 준 경우에만 그 선택으로 좁힌다.
      - name: pytest
        shell: bash
        env:
          AGENT_FLOW_SKIP_CODEX_TRUST: "1"
          # CI runner에는 네트워크가 있다. 릴리스 확인을 켠 채로 두면 릴리스가 나온
          # 뒤부터 stderr에 경고 한 줄이 끼어들어 출력 대조 테스트가 붉어진다.
          AGENT_FLOW_NO_UPDATE_CHECK: "1"
          PYTEST_K: ${{ inputs.pytest_k }}
        run: |
          started=$(date +%s)
          set +e
          args=(tests -v -p no:cacheprovider -o addopts=""
            -n auto --dist worksteal --durations=20
            --splits "$SHARD_COUNT" --group "$SHARD_INDEX"
            --splitting-algorithm least_duration)
          if [ -n "$PYTEST_K" ]; then
            args+=(-k "$PYTEST_K")
          fi
          PYTHONPATH=src python3 -m pytest "${args[@]}" 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - started ))
          # 로그를 뒤지지 않고도 벽시계 시간이 남게 요약에 박는다. 요약 기록이
          # 실패해도 pytest 종료 코드를 잃지 않게 통째로 감싼다. 펜스는 pytest
          # 출력의 ```보다 길게 잡는다.
          {
            echo "## pytest"
            echo
            echo "- selection: ${PYTEST_K:-full suite}"
            echo "- shard: ${SHARD_INDEX}/${SHARD_COUNT}"
            echo "- wall clock: ${elapsed}s"
            echo "- exit code: ${status}"
            echo
            echo '````'
            tail -n 30 pytest.log
            echo '````'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          exit "$status"

  # 기존 required check 이름을 유지하고 모든 분할의 성공을 요구한다.
  pytest:
    if: always()
    needs: pytest-shards
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all test partitions to pass
        env:
          SHARD_RESULT: ${{ needs.pytest-shards.result }}
        run: test "$SHARD_RESULT" = success

  # 전 스위트는 통과/실패 하나로 답한다. 그 신호로는 "회귀되면 안 되는 것이
  # 회귀했다"와 "무관한 테스트가 깨졌다"를 가릴 수 없고, 가드 테스트가 이름만
  # 바뀌어 사라진 경우에는 아무 신호도 나지 않는다 — 없는 테스트는 실패하지
  # 않는다. 이 job은 그 두 침묵을 각각 붉은 줄로 바꾼다.
  frozen-invariants:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # 목록은 스위트의 일부이므로 전체보다 훨씬 짧다. 실측 상한이 아니라 매달린
    # job을 끊는 값이다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 이 계약들은 node installer와 git fixture를 실제로 띄운다.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: frozen contracts
        shell: bash
        env:
          AGENT_FLOW_SKIP_CODEX_TRUST: "1"
          AGENT_FLOW_NO_UPDATE_CHECK: "1"
        run: |
          # 알 수 없는 레코드를 버리지 않고 먼저 실패시킨다. 오타 난 PR 번호나 형식은
          # 계약을 조용히 선택 해제할 수 없다.
          contracts_file="$RUNNER_TEMP/frozen-contracts.txt"
          if ! awk '
            /^[[:space:]]*($|#)/ { next }
            $1 == "uncovered" && $2 ~ /^[0-9]+$/ && NF >= 3 { next }
            $1 ~ /^[0-9]+$/ && NF == 2 &&
              $2 ~ /^tests\/[^[:space:]]+\.py::[^[:space:]]+$/ {
              print $2
              next
            }
            {
              printf "frozen_contracts.txt:%d: invalid record\n", NR > "/dev/stderr"
              invalid = 1
            }
            END { exit invalid }
          ' tests/frozen_contracts.txt > "$contracts_file"; then
            exit 1
          fi
          mapfile -t contracts < "$contracts_file"
          # 목록이 비면 pytest는 인자 없이 전 스위트를 돌아 초록을 낸다. 그
          # 초록은 "계약을 지켰다"가 아니라 "아무것도 고르지 않았다"다.
          if [ "${#contracts[@]}" -eq 0 ]; then
            echo "frozen_contracts.txt selected no node id" >&2
            exit 1
          fi
          echo "frozen contracts: ${#contracts[@]}"
          PYTHONPATH=src python3 -m pytest "${contracts[@]}" \
            -q -p no:cacheprovider -o addopts="" -n auto

  # 테스트 스위트와 병렬로 도는 별도 job이다. PR의 base kit과 head kit에
  # `evals/phase_budget.py`를 각각 돌려(모델 호출 없음, 결정적) phase별 필수 skill과
  # 프롬프트 바이트를 비교한다. 판정 기준은 maintainer/verification-policy.md의
  # "phase skill 전달 회귀 평가"다.
  phase-budget:
    if: github.event_name == 'pull_request'
    name: phase_budget ${{ matrix.kit }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kit: [base, head]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # 측정 스크립트는 head 것을 쓰고, 측정 대상 kit만 base/head 커밋의 트리로 바꾼다.
      - name: Extract the kit under measurement
        env:
          REF: ${{ matrix.kit == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/kit"
          git archive "$REF" | tar -x -C "$RUNNER_TEMP/kit"
      - name: Measure
        env:
          AGENT_FLOW_SKIP_CODEX_TRUST: "1"
          AGENT_FLOW_NO_UPDATE_CHECK: "1"
          KIT: ${{ matrix.kit }}
        run: python evals/phase_budget.py --kit "$RUNNER_TEMP/kit" --jobs 4 --output "budget-${KIT}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: budget-${{ matrix.kit }}
          path: budget-${{ matrix.kit }}.json
          retention-days: 14

  # 의도한 변화면 PR 본문에 이유를 적고 `phase-budget-accepted` 라벨을 붙인 뒤 이 job만
  # 다시 돌린다. 라벨은 이벤트 payload가 아니라 실행 시점의 PR에서 읽으므로 재실행에 반영된다.
  phase-budget-compare:
    if: github.event_name == 'pull_request'
    needs: phase-budget
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: budget-*
          merge-multiple: true
      - name: Compare base and head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          accept=()
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
              | grep -qx 'phase-budget-accepted'; then
            accept=(--accept)
          fi
          python evals/phase_budget_compare.py budget-base.json budget-head.json \
            --summary "$GITHUB_STEP_SUMMARY" "${accept[@]}"
