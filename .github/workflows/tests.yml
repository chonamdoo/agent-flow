name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  # 전 스위트가 몇 분인지는 로컬 추정이 아니라 실측이어야 한다.
  # `gh workflow run tests.yml`로 아무 브랜치에서나 재볼 수 있게 열어 둔다.
  workflow_dispatch:
    inputs:
      pytest_k:
        description: "pytest -k expression (empty = full suite)"
        required: false
        default: ""

jobs:
  # 이 job이 없으면 테스트 스위트 전체가 로컬 자기신고다. 통과 여부를 저장소
  # 밖에서 판정하는 관측자는 CI뿐이다.
  pytest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # 실측이 근거다: 이 변경 뒤 첫 dispatch 실행(32042088206)이 setup 포함 12m32s였고,
    # 그 전 직렬·fsync 시절이 16~28.5분이었다. 상한은 그 실측에 60% 여유를 둔 값이다 —
    # runner 지연 변동을 실패로 바꾸지 않으면서, 매달린 job은 20분에 끊는다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 설치·hook·worktree 테스트가 node를 서브프로세스로 띄운다.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 기본은 전 스위트다. package.json의 `test`는 일부만 돌려서 CI 기준으로 쓸 수
      # 없다. workflow_dispatch에서 pytest_k를 준 경우에만 그 선택으로 좁힌다.
      - name: pytest
        shell: bash
        env:
          AGENT_FLOW_SKIP_CODEX_TRUST: "1"
          PYTEST_K: ${{ inputs.pytest_k }}
        run: |
          started=$(date +%s)
          set +e
          # `-n auto`는 runner의 코어 수를 쓴다. 이 스위트는 시간의 거의 전부가 자식
          # 프로세스 대기라 코어 수만큼 곧바로 줄어든다.
          if [ -n "$PYTEST_K" ]; then
            PYTHONPATH=src python3 -m pytest tests -q -p no:cacheprovider -o addopts="" \
              -n auto --durations=20 -k "$PYTEST_K" 2>&1 | tee pytest.log
          else
            PYTHONPATH=src python3 -m pytest tests -q -p no:cacheprovider -o addopts="" \
              -n auto --durations=20 2>&1 | tee pytest.log
          fi
          status=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - started ))
          # 로그를 뒤지지 않고도 벽시계 시간이 남게 요약에 박는다. 요약 기록이
          # 실패해도 pytest 종료 코드를 잃지 않게 통째로 감싼다. 펜스는 pytest
          # 출력의 ```보다 길게 잡는다.
          {
            echo "## pytest"
            echo
            echo "- selection: ${PYTEST_K:-full suite}"
            echo "- wall clock: ${elapsed}s"
            echo "- exit code: ${status}"
            echo
            echo '````'
            tail -n 30 pytest.log
            echo '````'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          exit "$status"
