name: Context Docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  context-docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_context_docs.py
