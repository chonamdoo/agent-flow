name: Context Docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  context-docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/check-context-docs.ts
