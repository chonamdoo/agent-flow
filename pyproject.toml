[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-flow"
version = "0.1.0"
description = "Project-agnostic AI workflow kit"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "click>=8.0",
]
readme = "README.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.8",
]

[tool.pytest.ini_options]
# Cap workers below the core count: the suite's real-subprocess guard/git/node
# tests spawn child processes that starve (git 10s timeout) when in-process tests
# saturate every core under `-n auto`. 6 workers keeps ample headroom for spawns.
addopts = "-n 6 --dist loadgroup"

[project.scripts]
agent-flow = "agent_flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_flow"]

[tool.hatch.build.targets.wheel.force-include]
"bootstrap" = "agent_flow/bootstrap"
"templates/_shared" = "agent_flow/templates/_shared"
