[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-flow"
version = "0.1.0"
description = "Personal agent workflow kit with environment adapters and reusable project profiles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.scripts]
agent-flow = "agent_flow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_flow"]

[tool.hatch.build.targets.wheel.force-include]
"workflows" = "agent_flow/workflows"
"profiles" = "agent_flow/profiles"
"roles" = "agent_flow/roles"
"templates" = "agent_flow/templates"
