[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-flow"
version = "0.1.0"
description = "Project-agnostic AI workflow kit"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "click>=8.0",
]
readme = "README.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
agent-flow = "agent_flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_flow"]

[tool.hatch.build.targets.wheel.force-include]
"bootstrap" = "agent_flow/bootstrap"
"templates/_shared" = "agent_flow/templates/_shared"
