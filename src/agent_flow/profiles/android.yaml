id: android
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
  worktree_setup:
    # Gradle은 `sdk.dir`을 여기서 읽는다. 없으면 worktree 빌드가 SDK를 못 찾는다.
    copy:
      - local.properties
gates:
  - id: architecture-lint
    command: ["agent-flow", "architecture-lint", "--profile", "android"]
    required: true
    phase: pre-commit
  - id: build
    command: ["./gradlew", "assembleDevDebug"]
    required: true
    phase: pre-push
  - id: test
    command: ["./gradlew", "test"]
    required: true
    phase: pre-commit
  - id: lint
    command: ["./gradlew", "lint"]
    required: false
    phase: pre-commit
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: android-skills
    prompt: templates/_shared/review/android-skills.md
  - id: compose-stability
    prompt: templates/_shared/review/compose-stability.md
  - id: test-edge
    prompt: templates/_shared/review/test-edge.md
  - id: sdui
    prompt: templates/_shared/review/sdui.md
  - id: udf
    prompt: templates/_shared/review/udf.md
skills:
  install:
    - android-appshell-error-handling
    - android-clean-architecture
    - android-clean-presentation-architecture
    - android-code-review
    - android-guides
    # 우리가 배포하는 Android skill이다. 이름이 upstream과 겹쳐 보인다는 이유로 표가
    # 이 둘을 외부 것으로 선언했고, 그 결과 install 대상에서 빠져 있었다.
    - android-debugging
    - android-module-creator
    # 설치와 활성화는 다른 층이다. 여기 없으면 카탈로그에 아예 안 올라가서
    # frontmatter의 taskTerms/pathGlobs가 무슨 선언을 하든 죽는다.
    # 설치는 profile이 넓게, 활성화는 선언이 좁게 한다.
    - android-sdui-architecture
  required_review:
    - group: profile
      skills: [android-code-review, android-clean-architecture]
      when: Android/Kotlin/Compose/KMP files or Android profile architecture roles change
      missing: "missing local profile: <skill>"
      path_globs: ["**/*.kt", "**/*.kts", "**/*.java", "**/AndroidManifest.xml"]
  # 설치된 외부 skill 라우팅. 이름은 여기 적지 않는다 — upstream이 6개월에 이름 35%를
  # 바꿨고(실측: `camera1-to-camerax` → `camerax`), 이름을 적는 순간 우리 파일이 낡는다.
  # 대신 스택 어휘를 적고, 판정은 설치된 SKILL.md의 name + description에 대해 한다.
  external:
    enabled: true
    domains:
      - id: ui-insets-systembars
        terms: ["edge-to-edge", "insets", "system bar", "status bar", "navigation bar", "cutout", "fullscreen"]
        phases: [implementation, review]
      - id: adaptive-formfactor
        terms: ["adaptive", "window size class", "foldable", "tablet", "large screen", "wear os", "material3"]
        phases: [implementation, review]
      - id: navigation
        terms: ["navigation 3", "navigation3", "nav3", "back stack", "navigation graph", "deep link"]
        phases: [implementation, review]
      # `**/*.kt` 같은 광역 glob은 넣지 않는다. Kotlin 한 줄 변경만으로 domain이 켜지고
      # 실측으로 무관한 skill 20개가 offered를 포화시켰다. task 문구가 근거를 대야 한다.
      - id: compose-state-performance
        terms: ["recomposition", "stability", "strong skipping", "deferred read", "state hoisting",
                "state holder", "launchedeffect", "disposableeffect", "side effect", "slot api",
                "compose modifier", "modifier chain", "modifier node", "lazy list", "baseline profile"]
        phases: [implementation, review]
      - id: kotlin-concurrency
        terms: ["coroutine", "coroutinescope", "stateflow", "sharedflow", "statein", "cancellation",
                "runblocking", "expect/actual", "multiplatform", "value class"]
        phases: [implementation, review]
      - id: testing
        terms: ["testing setup", "robolectric", "androidtest", "instrumentation", "screenshot test",
                "semantics", "compose ui test"]
        path_globs: ["**/src/test/**", "**/src/androidTest/**"]
        phases: [implementation, review]
      - id: release-shrinker
        terms: ["r8", "proguard", "shrinker", "minify", "obfuscation", "mapping file", "app size"]
        path_globs: ["**/proguard-rules.pro", "**/*.pro"]
        phases: [implementation, review]
      - id: performance-trace
        terms: ["perfetto", "trace analysis", "jank", "startup time", "frame timing"]
        phases: [implementation, review]
      # 리뷰에서 요구할 이유가 없는 통합 작업. phase축은 우리 workflow의 개념이라
      # upstream이 바뀌어도 낡지 않는다.
      - id: platform-sdk
        terms: ["camerax", "camera2", "play billing", "engage sdk", "app functions", "credential manager",
                "verified email", "glimmer", "display glasses", "intent redirection", "pendingintent"]
        phases: [implementation]
      - id: tooling-cli
        terms: ["adb", "emulator", "sdkmanager", "agp", "gradle plugin", "perfetto sql", "trace query",
                "xml to compose", "styles api"]
        phases: [implementation]
architecture:
  contract: clean-architecture-core
  platform: android
  roles:
    - id: app-shell
      paths: ["app", "android/app"]
      modules: [":app"]
      forbidden: ["ApiService", "RemoteDataSource", "Dto", "Entity"]
    - id: core-domain
      paths: ["core/domain/<context>"]
      modules: [":core:domain:<context>"]
      package_suffix: "core.domain.<context>"
      pair_with: core-data
      forbidden: ["ApiService", "RemoteDataSource", "Dto", "@Composable", "ViewModel"]
    - id: core-data
      paths: ["core/data/<context>"]
      modules: [":core:data:<context>"]
      package_suffix: "core.data.<context>"
      pair_with: core-domain
      forbidden: ["@Composable", "ViewModel"]
    - id: feature-api
      paths: ["feature/<feature>/api"]
      modules: [":feature:<feature>:api"]
      package_suffix: "feature.<feature>.api"
      pair_with: feature-presentation
      forbidden: ["Screen", "ViewModel", "RepositoryImpl", "RemoteDataSource", "ApiService"]
    - id: feature-presentation
      paths: ["feature/<feature>/presentation"]
      modules: [":feature:<feature>:presentation"]
      package_suffix: "feature.<feature>.presentation"
      pair_with: feature-api
      forbidden: ["ApiService", "RemoteDataSource", "Dto", "Entity"]
    - id: core-design-system
      paths: ["core/designsystem"]
      modules: [":core:designsystem"]
      package_suffix: "core.designsystem"
    - id: core-ui
      paths: ["core/ui"]
      modules: [":core:ui"]
      package_suffix: "core.ui"
    - id: core-resources
      paths: ["core/resources"]
      modules: [":core:resources"]
      package_suffix: "core.resources"
    - id: core-network
      paths: ["core/network"]
      modules: [":core:network"]
      package_suffix: "core.network"
    - id: core-platform
      paths: ["core/platform"]
      modules: [":core:platform"]
      package_suffix: "core.platform"
    - id: core-platform-adapter
      paths: ["core/platform/<adapter>"]
      modules: [":core:platform:<adapter>"]
      package_suffix: "core.platform.<adapter>"
    - id: core-permission
      paths: ["core/permission"]
      modules: [":core:permission"]
      package_suffix: "core.permission"
    - id: navigation-api
      paths: ["core/navigation/api"]
      modules: [":core:navigation:api"]
      package_suffix: "core.navigation.api"
    - id: navigation-impl
      paths: ["core/navigation/impl"]
      modules: [":core:navigation:impl"]
      package_suffix: "core.navigation.impl"
skill_sources:
  # 설치 관리자가 이미 있는 소스는 fetch하지 않는다. 경로만 해석하고, 없으면 install 시점에 1회 안내한다.
  - id: android-official
    kind: host-managed
    install_hint: "android skills add <name>  (https://github.com/android/skills)"
    roots:
      - "~/.android/cli/skills/**/{skill}/SKILL.md"
      - "~/.claude/skills/{skill}/SKILL.md"
      - "~/.codex/skills/{skill}/SKILL.md"
  - id: chrisbanes
    kind: host-managed
    install_hint: "/plugin marketplace add chrisbanes/skills  (https://github.com/chrisbanes/skills)"
    roots:
      - "~/.claude/plugins/marketplaces/*/skills/{skill}/SKILL.md"
      - "~/.claude/skills/{skill}/SKILL.md"
      - "~/.codex/skills/{skill}/SKILL.md"
  # 설치 관리자가 없는 순수 git repo만 머신 공유 캐시로 1회 fetch한다. repo 안에는 넣지 않는다.
  - id: skydoves-compose-performance
    kind: fetch
    url: https://github.com/skydoves/compose-performance-skills
    ref: main
    layout: "*/{skill}/SKILL.md"
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: PRD
  adr: ADR
  lore: lore
commit_convention:
  style: tagged          # [Feat] / [Fix] / [Refactor] / ...
  co_author: skip
pr:
  target_branch: main
  merge_strategy: merge
