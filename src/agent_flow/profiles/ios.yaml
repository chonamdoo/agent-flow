id: ios
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: architecture-lint
    command: ["agent-flow", "architecture-lint", "--profile", "ios"]
    required: true
    phase: pre-commit
  - id: build
    command: ["xcodebuild", "-scheme", "App", "-destination", "platform=iOS Simulator,name=iPhone 15", "build"]
    required: true
    phase: pre-push
  - id: test
    command: ["xcodebuild", "-scheme", "App", "-destination", "platform=iOS Simulator,name=iPhone 15", "test"]
    required: true
    phase: pre-push
  - id: lint
    command: ["swiftlint"]
    required: false
    phase: pre-commit
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: retain-cycles
    prompt: templates/_shared/review/retain-cycles.md
  - id: main-thread
    prompt: templates/_shared/review/main-thread.md
skills:
  install:
    - ios-app-shell-error-handling
    - ios-clean-architecture
    - ios-clean-presentation-architecture
  required_review:
    - group: profile
      skills: [ios-clean-architecture, ios-clean-presentation-architecture]
      when: iOS/Swift files change
      missing: "missing local profile: <skill>"
  # iOS 생태계에는 Apple 공식 앱개발 skill이 없고, 커뮤니티가 1 repo = 1 skill로
  # 파편화되어 있다(twostraws/Dimillian/AvdLee/...). 이름을 적으면 repo 하나가 사라질
  # 때마다 낡으므로, 스택 어휘만 두고 설치된 SKILL.md의 name + description에 맞춘다.
  external:
    enabled: false
    domains:
      - id: swiftui-view-state
        terms: ["swiftui", "swiftui view", "ios views", "view modifier", "navigationstack",
                "navigationsplitview", "observable macro", "environment object", "state holder",
                "property wrapper", "data flow", "preview macro"]
        path_globs: ["**/*.swift"]
        phases: [implementation, review]
      - id: swift-concurrency
        terms: ["swift concurrency", "async/await", "actor isolation", "sendable", "mainactor",
                "structured concurrency", "task cancellation", "asyncsequence", "data race"]
        path_globs: ["**/*.swift"]
        phases: [implementation, review]
      - id: swift-persistence
        terms: ["swiftdata", "core data", "modelcontainer", "modelcontext", "nsmanagedobject",
                "nspersistentcontainer", "schema migration"]
        phases: [implementation, review]
      - id: xcode-build-signing
        terms: ["xcodebuild", "xcode scheme", "xcconfig", "build settings", "build configuration",
                "code signing", "provisioning profile", "archiving", "xcarchive", "export ipa",
                "derived data"]
        path_globs: ["**/*.xcodeproj/**", "**/*.xcconfig", "**/Podfile", "**/Package.swift"]
        phases: [implementation, review]
      - id: swift-testing
        terms: ["swift testing", "xctest", "xcuitest", "test macro", "snapshot test",
                "ui automation test"]
        path_globs: ["**/*Tests/**"]
        phases: [implementation, review]
      - id: accessibility-voiceover
        terms: ["voiceover", "dynamic type", "accessibility label", "accessibility trait",
                "accessibility identifier", "tap target", "contrast", "wcag"]
        phases: [implementation, review]
      # 스토어 자산과 시뮬레이터 구동은 산출물을 만드는 작업이라 리뷰가 요구할 대상이 아니다.
      - id: simulator-store-assets
        terms: ["simulator", "app store screenshot", "marketing screenshot", "store listing",
                "app store connect", "testflight", "device navigation"]
        phases: [implementation]
      # KMP가 iOS 경로에 걸릴 때만 쓰는 어휘. "kotlin multiplatform"/"kmp"는 실측상
      # agp-9-upgrade(무관)를 끌어와서 뺐다.
      - id: kmp-ios-interop
        terms: ["cocoapods", "podfile", "xcframework", "spm migration", "objective-c interop",
                "expect/actual", "kotlin/native"]
        path_globs: ["**/iosMain/**", "**/iosApp/**"]
        phases: [implementation]
architecture:
  contract: clean-architecture-core
  platform: ios
  roles:
    - id: app-shell
      paths: ["App", "Sources/App"]
    - id: core-domain
      paths: ["Sources/Core/Domain/<context>"]
      pair_with: core-data
      forbidden: ["ApiClient", "DTO", "View", "ViewModel"]
    - id: core-data
      paths: ["Sources/Core/Data/<context>"]
      pair_with: core-domain
      forbidden: ["View", "ViewModel"]
    - id: feature-api
      paths: ["Sources/Features/<feature>/API"]
      pair_with: feature-presentation
      forbidden: ["View", "ViewModel", "RepositoryImpl", "ApiClient"]
    - id: feature-presentation
      paths: ["Sources/Features/<feature>/Presentation"]
      pair_with: feature-api
      forbidden: ["ApiClient", "DataSource", "DTO", "Entity"]
    - id: core-ui
      paths: ["Sources/Core/UI", "Sources/Core/DesignSystem", "Sources/Core/Resources"]
    - id: core-network
      paths: ["Sources/Core/Network", "Sources/Core/Platform", "Sources/Core/Permission"]
    - id: navigation-api
      paths: ["Sources/Core/Navigation/API"]
    - id: navigation-impl
      paths: ["Sources/Core/Navigation/Impl"]
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
  lore: notes
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
