# agent-flow profile schema (v1)
#
# Profiles describe per-stack behavior without leaking that knowledge into
# workflow definitions. A workflow phase reads e.g. profile.gates and acts
# accordingly; the workflow itself stays stack-neutral.

version: 1

# Required fields every profile must declare. Comments document expected
# semantics; runners read these via PyYAML and validate against this shape.

required:
  - id                  # unique profile identifier (matches filename stem)

optional:
  branching:
    strategy: "release-first | trunk | gitflow"
    base: "branch name to start work from"
    integration: "branch where PRs target"
    worktree: "required | optional | disabled"
    naming:
      prefix: "namespace prefix for agent-generated branches (e.g. feat/)"
      slug_style: "kebab-case | snake_case"
      slug_source: "feature title | slice id | free-form short summary"
      max_slug_length: 60
      examples:
        - "feat/chat-search-bottom-padding"
        - "feat/og-metadata-preview"
      # 비ASCII task의 이름 짓기를 활성 host(`AGENT_FLOW_HOST`)에 위임한다.
      # `{task}`는 인자로 들어가고 stdout 첫 줄을 제안으로 읽는다. 제안은 다시 검증한다.
      slug_command:
        claude: ["command", "args...", "{task}"]
        codex: ["command", "args...", "{task}"]
        omp: ["command", "args...", "{task}"]
    # `git worktree add`는 추적 파일만 가져온다. gitignored 머신 설정은 새 worktree에
    # 없어서 빌드가 leader에서는 되고 worktree에서는 안 된다. 여기 선언한 파일만
    # leader에서 복사한다 — 이미 있는 파일은 덮지 않고, symlink는 건너뛴다.
    worktree_setup:
      copy:
        - "gitignored machine config to carry into a new worktree (e.g. local.properties)"
      # 정해진 동작만 켜고 끈다. 명령 문자열은 선언하지 않는다 — 임의 셸을 받으면
      # 그 한 줄이 CLI 신뢰 컨텍스트에서 검증 없이 돈다.
      link_node_modules: false   # leader의 node_modules를 symlink로 공유

  gates:
    # ordered list of verification commands
    - id: "stable id (e.g. build, test, lint)"
      command: ["command", "argument"]
      required: true
      phase: "pre-commit | pre-push | post-merge"

  review_angles:
    # zero or more specialist reviewers added at final-review.
    # The base run always includes one generalist reviewer; angles are extras.
    - id: "stable angle id"
      prompt: "path (relative to kit root) to the prompt template"

  skills:
    # Project-local skills selected when installing this profile.
    # The installer auto-includes declared dependencies such as clean-architecture-core.
    install:
      - "skill-name"
    # Skills this repo owns and therefore may name. A group activates only when it
    # declares selectors; a declaration without them has no activation evidence and
    # stays inert. Installed external skills are never named here - see `external`.
    required_review:
      - group: "profile"
        skills: ["skill-name"]
        when: "human rationale; not machine-matched"
        task_terms: ["optional lowercase substring matched against the run task"]
        path_globs: ["optional changed-file glob"]
        missing: "missing local <skill-group>: <skill>"
    # Installed external skills. We never enumerate their names here: upstream
    # renames and deletions make any name list stale (measured: 35% name churn in
    # six months for android/skills). The consumer declares vocabulary and scope;
    # the runtime matches it against the `name` + `description` every installed
    # SKILL.md carries. `pins` exists only for a measured vocabulary gap.
    external:
      enabled: "bool; when false the vocabulary is parsed but never routed"
      required_max: "int; deterministic truncation of the required tier"
      offered_max: "int; deterministic truncation of the offered tier"
      pins: ["exact skill name to force into the required tier when matched by a domain"]
      domains:
        - id: "stable domain id owned by this repo, not by upstream"
          terms: ["lowercase substring matched against both the run task and the skill text"]
          path_globs: ["optional changed-file glob that activates this domain"]
          phases: ["implementation | review"]

  architecture:
    # Canonical clean architecture role mapping. Paths are platform-native,
    # but role ids remain semantic and cross-platform.
    contract: "clean-architecture-core"
    platform: "android | react-native | react | ios | python"
    strict_when_roots_present: "optional bool; if true, deterministic lint is n/a until activation_roots exist or are changed"
    activation_roots: ["optional path roots that indicate the architecture contract is adopted"]
    roles:
      - id: "app-shell | android-native | core-domain | core-data | core-database | core-ui | core-design-system | core-resources | core-network | core-platform | core-platform-adapter | core-permission | feature-api | feature-presentation | navigation-api | navigation-impl"
        paths: ["platform/native/path/<context-or-feature>"]
        modules: ["optional module id pattern"]
        package_suffix: "optional package suffix pattern"
        pair_with: "optional role id that must exist for the same semantic boundary"
        forbidden: ["optional token that must not appear in this role"]

  artifacts:
    prd: "required | optional | skip"
    adr: "required | optional | skip"
    slice_plan: "required | optional | skip"

  vocabulary:
    # Stack-native renaming. Workflow YAML uses canonical ids (spec, decision-log,
    # notes); the AI substitutes vocabulary[name] when speaking to the user.
    prd: "spec"
    adr: "decision-log"
    lore: "notes"

  commit_convention:
    style: "conventional | tagged | freeform"
    co_author: "include | skip"

  pr:
    target_branch: "main | release | develop"
    merge_strategy: "squash | rebase | merge"
