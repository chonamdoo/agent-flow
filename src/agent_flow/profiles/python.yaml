id: python
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: test
    command: ["pytest"]
  - id: compile
    command: ["python", "-m", "compileall", "src"]
