id: node
capabilities: [react-web]
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: architecture-lint
    command: ["agent-flow", "architecture-lint", "--profile", "node"]
    required: true
    phase: pre-commit
  - id: typecheck
    command: ["npm", "run", "typecheck"]
    required: false
    phase: pre-commit
  - id: lint
    command: ["npm", "run", "lint"]
    required: false
    phase: pre-commit
  - id: test
    command: ["npm", "test"]
    required: true
    phase: pre-push
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: types
    prompt: templates/_shared/review/types.md
  - id: io-safety
    prompt: templates/_shared/review/io-safety.md
skills:
  install:
    - llm-tool-development
  required_review:
    - group: llm-tool-development
      skills: [llm-tool-development]
      task_terms: ["tool calling", "function calling", "mcp server", "mcp adapter", "툴콜", "mcp 서버"]
      path_globs: ["**/tool-dispatcher.*", "**/mcp-server.*"]
      concerns: [llm-tool-development]
      missing: "missing local LLM tool development: <skill>"
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
