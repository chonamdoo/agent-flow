id: spring
branching:
  strategy: gitflow
  base: develop
  integration: develop
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: context-lint
    command: ["node", "scripts/check-context-docs.mjs"]
    required: true
    phase: pre-commit
  - id: build
    command: ["./gradlew", "build", "-x", "test"]
    required: true
    phase: pre-commit
  - id: test
    command: ["./gradlew", "test"]
    required: true
    phase: pre-push
  - id: lint
    command: ["./gradlew", "check"]
    required: false
    phase: pre-commit
