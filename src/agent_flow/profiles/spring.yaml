id: spring
branching:
  strategy: gitflow
  base: develop
  integration: develop
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: build
    command: ["./gradlew", "build", "-x", "test"]
  - id: test
    command: ["./gradlew", "test"]
  - id: lint
    command: ["./gradlew", "check"]
