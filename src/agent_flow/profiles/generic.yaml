id: generic
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: context-lint
    command: ["node", "scripts/check-context-docs.mjs"]
    required: true
    phase: pre-commit
