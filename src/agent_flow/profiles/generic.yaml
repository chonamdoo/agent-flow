id: generic
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: architecture-lint
    command: ["agent-flow", "architecture-lint", "--profile", "generic"]
    required: true
    phase: pre-commit
review_angles:
  # Added when the phase requires a Clean Architecture contract. Profile fields
  # overlay the gated baseline rather than replacing it.
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
commit_convention:
  style: freeform
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
