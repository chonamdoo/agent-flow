id: react-native
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: context-lint
    command: ["node", "scripts/check-context-docs.mjs"]
    required: true
    phase: pre-commit
  - id: lint
    command: ["npm", "run", "lint"]
    required: false
    phase: pre-commit
  - id: test
    command: ["npm", "test"]
    required: true
    phase: pre-push
  - id: ios-build
    command: ["npx", "react-native", "run-ios", "--no-packager"]
    required: false
    phase: pre-push
  - id: android-build
    command: ["sh", "-c", "cd android && ./gradlew assembleDebug"]
    required: false
    phase: pre-push
