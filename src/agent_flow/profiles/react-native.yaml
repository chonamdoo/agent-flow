id: react-native
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: architecture-lint
    command: ["agent-flow", "architecture-lint", "--profile", "react-native"]
    required: true
    phase: pre-commit
  - id: lint
    command: ["npm", "run", "lint"]
    required: false
    phase: pre-commit
  - id: test
    command: ["npm", "test"]
    required: true
    phase: pre-push
  - id: ios-build
    command: ["npx", "react-native", "run-ios", "--no-packager"]
    required: false
    phase: pre-push
  - id: android-build
    command: ["sh", "-c", "cd android && ./gradlew assembleDebug"]
    required: false
    phase: pre-push
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: render-stability
    prompt: templates/_shared/review/render-stability.md
  - id: native-bridge
    prompt: templates/_shared/review/native-bridge.md
skills:
  install:
    - react-native-app-shell-error-handling
    - react-native-clean-architecture
    - react-native-clean-presentation-architecture
    - react-native-development-guide
    - react-native-operational-adoption
    - typescript-development-guide
  required_review:
    # baseline과 architecture를 가른다. 한 group에 두면 문구·색상만 바꾸는 변경에도
    # 계층 계약 문서가 required가 된다(실측: `.tsx` 한 줄 변경에 required 4개 /
    # 15,746 B → 2개 / 5,220 B). architecture 문서는 계층 경계 경로가 실제로 바뀔 때만
    # 요구한다 — 경로 목록은 이 profile의 `architecture.roles`에서 온다.
    - group: profile
      skills: [react-native-development-guide]
      when: React Native/Expo files change
      missing: "missing local profile: <skill>"
      path_globs: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/app.json", "**/app.config.*"]
    # app-shell과 native host role은 여기서 뺀다. `app/**`는 App Router 프로젝트의
    # 소스 대부분이고 Android의 `app` 모듈도 그렇다 — 넣으면 문구만 바꾸는 변경이 다시
    # 계층 문서를 요구해 축소가 사라진다. 그 자리의 배선 검토는 `--concern`으로 지목한다.
    # 자리표시자(`<context>`) 아래만 걸면 layer 루트의 파일이 빠지므로 layer 디렉터리
    # 전체를 잡는다.
    - group: architecture
      skills: [react-native-clean-architecture]
      when: React Native profile architecture role paths change
      missing: "missing local profile: <skill>"
      # 배선 자리처럼 경로로 드러나지 않는 계층 검토를 지목하는 유일한 통로다.
      # 주석이 `--concern`을 가리키므로 id가 여기 선언돼 있어야 오타로 거부되지 않는다.
      concerns: [architecture]
      path_globs: ["**/src/core/domain/**", "**/src/core/data/**", "**/src/features/**", "**/src/core/ui/**", "**/src/core/design-system/**", "**/src/core/resources/**", "**/src/core/network/**", "**/src/core/platform/**", "**/src/core/permission/**", "**/src/core/navigation/api/**", "**/src/core/navigation/impl/**"]
    # TypeScript 가이드의 범위는 그 skill이 선언한 `*.ts`/`*.tsx`다. RN 표의 glob에
    # 섞으면 `app.json`이나 `*.js` 변경에서도 required가 된다.
    - group: typescript
      skills: [typescript-development-guide]
      when: TypeScript files change
      missing: "missing local profile: <skill>"
      path_globs: ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts"]
  # 설치된 외부 skill 라우팅. 이름은 여기 적지 않는다 — Expo 공식 `expo/skills`가 6개월에
  # rename 10건 + 삭제 2건을 냈다(실측: `upgrading-expo` → `expo-upgrade`,
  # `expo-deployment` → `eas-app-stores`). 이름을 적는 순간 우리 파일이 낡는다.
  external:
    enabled: true
    domains:
      # `expo`/`eas` 단독 term은 금지다. 실측으로 "export"/"exportable"과 "easy"/"measured"에
      # substring으로 걸려 building-with-xcode·ios-screenshots·math-olympiad를 끌어온다.
      - id: expo-sdk-config
        terms: ["expo sdk", "expo upgrade", "expo prebuild", "expo module", "config plugin",
                "app.config", "app.json", "dev client", "development build", "expo dom",
                "autolinking"]
        phases: [implementation]
      - id: eas-release
        terms: ["eas build", "eas update", "eas submit", "eas workflow", "over-the-air",
                "ota update", "app store submission", "play store submission",
                "internal distribution"]
        phases: [implementation]
      # `fabric`은 "fabricate"에 걸리므로 구절로만 쓴다. native-bridge가 이 profile의
      # review angle이라 review에서도 활성화한다.
      - id: native-interop
        terms: ["turbo module", "turbomodule", "fabric renderer", "fabric component", "jsi",
                "codegen", "native module", "view manager", "bridgeless", "new architecture",
                "native bridge"]
        phases: [implementation, review]
      - id: list-render-performance
        terms: ["flatlist", "flashlist", "sectionlist", "virtualized list", "re-render",
                "rerender", "memoization", "usememo", "usecallback", "reanimated",
                "gesture handler", "list performance"]
        phases: [implementation, review]
      - id: hermes-bundle
        terms: ["hermes", "bundle size", "metro bundler", "metro config", "inline requires",
                "startup time", "tree shaking", "source map", "ram bundle"]
        phases: [implementation, review]
      - id: navigation-linking
        terms: ["react navigation", "expo router", "stack navigator", "bottom tabs", "deep link",
                "universal link", "app link", "screen options", "navigation state"]
        phases: [implementation, review]
      # 이 두 domain이 `android-native-escalation`의 자리를 대신한다. 다른 profile의 표를
      # 끌어오는 대신, 네이티브 디렉터리 변경만으로 설치된 네이티브 skill에 직접 붙는다.
      - id: android-native
        terms: ["gradle plugin", "android gradle plugin", "agp", "proguard", "r8", "kotlin",
                "edge-to-edge", "insets", "android manifest", "foreground service",
                "runtime permission"]
        path_globs: ["android/**"]
        phases: [implementation, review]
      - id: ios-native
        terms: ["cocoapods", "podfile", "xcodebuild", "xcode project", "code signing",
                "provisioning profile", "swift package", "info.plist", "usage description",
                "app extension"]
        path_globs: ["ios/**"]
        phases: [implementation, review]
      # 컴포넌트 설계 어휘. `list-render-performance`는 리스트 자료구조 쪽 어휘라
      # 컴포넌트 API 설계(compound component, render prop)에 걸리지 않았다.
      # 실측: `context provider`는 clean-architecture 계열 4개를 함께 끌어와서 뺐다.
      #
      # 이 domain은 `nextjs`와 id도 어휘도 같다. 같아야 한다 — `merged_profile_payload`는
      # 같은 id를 먼저 온 profile 것만 남기므로(`core/local_skills.py:109-113`), 어휘가
      # 갈리면 합집합의 어휘를 profile 탐지 순서가 정하게 된다.
      #
      # 스택 전용 어휘는 아래 별도 domain으로 뺀다. 한 domain이 다른 domain 어휘의
      # superset이면 id가 달라도 순서가 남는다: `match_external`은 skill을 **먼저 걸린
      # domain**에 배정하고 `_truncate`가 domain별 round-robin으로 자르므로, superset
      # 쪽이 먼저 순회되면 공통 skill까지 그 bucket으로 빨려 들어가 bucket 분포가 달라진다.
      # 이 domain을 스택 전용 domain보다 **앞에** 두는 것도 같은 이유다 — 두 순서 모두에서
      # 공통 어휘가 먼저 순회돼야 배정이 같다.
      - id: component-design
        terms: ["bundle optimization", "component architecture",
                "compound component", "render prop", "boolean prop"]
        phases: [implementation, review]
      # RN 전용. 웹에서는 이 term이 React Native용 best-practices skill을 Next.js
      # 프로젝트로 끌어와서 `nextjs`에는 두지 않는다(실측).
      - id: rn-component-performance
        terms: ["performance optimization"]
        phases: [implementation, review]
      # 스타일링·네이티브 UI 표면. `tailwind` 단독은 웹 아티팩트 skill을 끌어오므로
      # RN 쪽은 `nativewind`로만 받는다.
      - id: ui-styling-system
        terms: ["nativewind", "sf symbol", "native control", "visual effect", "semantic color",
                "apple hig", "responsive layout"]
        phases: [implementation, review]
      # 채택·이관 작업. 구현 단계에서만 쓰고 리뷰 각도로는 요구하지 않는다.
      - id: migration-adoption
        terms: ["brownfield", "greenfield", "migration readiness", "web to native",
                "xcframework", "app clip"]
        phases: [implementation]
      - id: tv-surface
        terms: ["tvos", "d-pad", "10-foot", "tv focus", "remote input"]
        phases: [implementation, review]
architecture:
  contract: clean-architecture-core
  platform: react-native
  roles:
    - id: app-shell
      paths: ["src/app", "app"]
    - id: android-native
      paths: ["android"]
    - id: core-domain
      paths: ["src/core/domain/<context>"]
      pair_with: core-data
      forbidden: ["ApiClient", "Dto", "View", "Screen"]
    - id: core-data
      paths: ["src/core/data/<context>"]
      pair_with: core-domain
      forbidden: ["View", "Screen"]
    - id: feature-api
      paths: ["src/features/<feature>/api"]
      pair_with: feature-presentation
      forbidden: ["Screen", "ViewModel", "RepositoryImpl", "ApiClient"]
    - id: feature-presentation
      paths: ["src/features/<feature>/presentation"]
      pair_with: feature-api
      forbidden: ["ApiClient", "DataSource", "Dto", "Entity"]
    - id: core-ui
      paths: ["src/core/ui", "src/core/design-system", "src/core/resources"]
    - id: core-network
      paths: ["src/core/network", "src/core/platform", "src/core/permission"]
    - id: navigation-api
      paths: ["src/core/navigation/api"]
    - id: navigation-impl
      paths: ["src/core/navigation/impl"]
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
  lore: notes
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
