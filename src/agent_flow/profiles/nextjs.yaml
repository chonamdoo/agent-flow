id: nextjs
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: build
    command: ["npm", "run", "build"]
  - id: typecheck
    command: ["npm", "run", "typecheck"]
  - id: lint
    command: ["npm", "run", "lint"]
