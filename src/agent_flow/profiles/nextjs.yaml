id: nextjs
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: architecture-lint
    command: ["agent-flow", "architecture-lint", "--profile", "nextjs"]
    required: true
    phase: pre-commit
  - id: build
    command: ["npm", "run", "build"]
    required: true
    phase: pre-push
  - id: test
    command: ["npm", "test"]
    required: true
    phase: pre-commit
  - id: lint
    command: ["npm", "run", "lint"]
    required: false
    phase: pre-commit
review_angles:
  - id: architecture-design
    prompt: templates/_shared/review/architecture-design.md
  - id: render-stability
    prompt: templates/_shared/review/render-stability.md
  - id: a11y
    prompt: templates/_shared/review/a11y.md
skills:
  install:
    - react-app-shell-error-handling
    - react-clean-architecture
    - react-clean-presentation-architecture
    - react-development-guide
    - typescript-development-guide
  required_review:
    # baseline과 architecture를 가른다. 한 group에 두면 문구·색상만 바꾸는 변경에도
    # 계층 계약 문서가 required가 된다(실측: `.tsx` 한 줄 변경에 required 4개 /
    # 15,746 B → 2개 / 5,220 B). architecture 문서는 계층 경계 경로가 실제로 바뀔 때만
    # 요구한다 — 경로 목록은 이 profile의 `architecture.roles`에서 온다.
    - group: profile
      skills: [react-development-guide]
      when: React/Next.js files change
      missing: "missing local profile: <skill>"
      path_globs: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs"]
    # app-shell과 native host role은 여기서 뺀다. `app/**`는 App Router 프로젝트의
    # 소스 대부분이고 Android의 `app` 모듈도 그렇다 — 넣으면 문구만 바꾸는 변경이 다시
    # 계층 문서를 요구해 축소가 사라진다. 그 자리의 배선 검토는 `--concern`으로 지목한다.
    # 자리표시자(`<context>`) 아래만 걸면 layer 루트의 파일이 빠지므로 layer 디렉터리
    # 전체를 잡는다.
    - group: architecture
      skills: [react-clean-architecture]
      when: React profile architecture role paths change
      missing: "missing local profile: <skill>"
      path_globs: ["**/src/core/domain/**", "**/src/core/data/**", "**/src/features/**", "**/src/core/ui/**", "**/src/core/design-system/**", "**/src/core/resources/**", "**/src/core/network/**", "**/src/core/platform/**", "**/src/core/permission/**", "**/src/core/navigation/api/**", "**/src/core/navigation/impl/**"]
    # TypeScript 가이드는 스스로 `*.ts`/`*.tsx` 범위를 선언한다. React 표의 glob에
    # 섞으면 `next.config.mjs` 하나만 바뀐 변경에서도 required가 되고, 같은 skill의
    # 범위를 두 profile이 다르게 선언하게 된다.
    - group: typescript
      skills: [typescript-development-guide]
      when: TypeScript files change
      missing: "missing local profile: <skill>"
      path_globs: ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts"]
  # 웹 스택은 사실상 표준 소스가 여러 개(vercel-labs, vercel/next.js, supabase, prisma,
  # shadcn-ui, stripe)라 이름 목록은 유지 자체가 불가능하다. 게다가 웹 SKILL.md에는
  # metadata.keywords가 없어 판정 근거가 name + description뿐이다. 그래서 어휘로만 적는다.
  external:
    enabled: true
    domains:
      - id: rsc-boundaries
        terms: ["server component", "client component", "server/client", "use client", "use server",
                "rsc", "hydration", "hydration mismatch", "suspense boundary", "streaming ssr",
                "list rendering"]
        path_globs: ["**/app/**", "**/*.tsx"]
        phases: [implementation, review]
      - id: next-runtime-caching
        terms: ["cache components", "partial prefetching", "prefetch", "revalidate", "route handler",
                "middleware", "server action", "form action", "next.js app router", "edge runtime",
                "static generation", "incremental static regeneration", "http caching"]
        path_globs: ["**/app/**", "**/pages/**", "**/middleware.ts"]
        phases: [implementation, review]
      - id: ts-type-modeling
        # 단독 "typescript"는 android-code-review·react-native까지 끌어와서 쓰지 않는다.
        terms: ["typescript project configuration", "tsconfig", "type narrowing", "discriminated union",
                "generic constraint", "declaration file", "zod", "runtime schema validation"]
        # `**/*.ts(x)`를 넣으면 모든 파일 변경이 이 domain을 켜므로 설정 파일만 본다.
        path_globs: ["**/tsconfig.json"]
        phases: [implementation, review]
      - id: design-system-styling
        terms: ["tailwind", "shadcn", "design token", "css module", "styled component",
                "aesthetic direction", "typography", "color palette", "landing page"]
        # 실측: `**/*.tsx`를 넣으면 흔한 컴포넌트 수정 하나로 브랜드/테마 skill 4개가 붙는다.
        # 스타일링 의도는 파일 확장자가 아니라 task 문구에만 있으므로 glob을 두지 않는다.
        phases: [implementation, review]
      - id: a11y-semantics
        # "a11y"/"wcag"/"accessibility"는 실기기 기반 모바일 감사 skill을 끌어오므로 제외하고
        # 웹 DOM 어휘만 남긴다. review_angles의 a11y 각도와 짝을 이룬다.
        terms: ["aria label", "aria-label", "aria attribute", "semantic html", "keyboard navigation",
                "focus management", "focus trap", "screen reader", "accessible name"]
        path_globs: ["**/*.tsx"]
        phases: [implementation, review]
      - id: browser-e2e-testing
        terms: ["playwright", "e2e test", "end-to-end test", "browser screenshot", "browser logs",
                "local web application", "debugging ui behavior", "visual regression"]
        path_globs: ["**/e2e/**", "**/*.spec.ts", "**/*.spec.tsx"]
        phases: [implementation, review]
      # 컴포넌트 API 설계. `rsc-boundaries`는 서버/클라이언트 경계 어휘라 컴포넌트
      # 합성(compound component, render prop)에 걸리지 않았다.
      # 실측: `context provider`는 clean-architecture 계열 4개를, `performance optimization`은
      # React Native용 best-practices skill을 함께 끌어와서 둘 다 뺐다. 웹 쪽 판정은
      # `bundle optimization` 하나로 충분하다(실측 1개).
      #
      # `react-native`의 같은 id와 어휘가 **바이트 단위로 같아야** 한다. 그래야
      # `merged_profile_payload`가 어느 쪽을 남기든 결과가 같다. RN 전용 어휘는
      # 그쪽 profile의 별도 domain(`rn-component-performance`)에 있다 — 이 목록에
      # 섞으면 여기서 뺀 그 어휘가 웹으로 돌아온다.
      - id: component-design
        terms: ["bundle optimization", "component architecture",
                "compound component", "render prop", "boolean prop"]
        phases: [implementation, review]
      # `design-system-styling`과 가르는 이유는 근거다. 저쪽은 시각 언어이고
      # 여기는 View Transition API라는 특정 브라우저/React API의 사용법이다.
      - id: view-transitions
        terms: ["view transition", "startviewtransition", "page transition", "shared element"]
        phases: [implementation, review]
      # 아래 둘은 외부 시스템 붙이는 작업이라 리뷰 각도로 요구할 이유가 없다.
      - id: data-layer-orm
        terms: ["prisma", "prisma schema", "prisma migrate", "supabase", "row level security",
                "drizzle", "postgres", "database migration", "sql schema"]
        path_globs: ["**/prisma/**", "**/supabase/**", "**/migrations/**"]
        phases: [implementation]
      - id: auth-payments-integration
        terms: ["nextauth", "auth.js", "clerk", "oauth callback", "session cookie",
                "stripe", "payment intent", "webhook handler"]
        phases: [implementation]
architecture:
  contract: clean-architecture-core
  platform: react
  roles:
    - id: app-shell
      paths: ["app", "src/app"]
    - id: core-domain
      paths: ["src/core/domain/<context>"]
      pair_with: core-data
      forbidden: ["ApiClient", "Dto", "Component", "Screen"]
    - id: core-data
      paths: ["src/core/data/<context>"]
      pair_with: core-domain
      forbidden: ["Component", "Screen"]
    - id: feature-api
      paths: ["src/features/<feature>/api"]
      pair_with: feature-presentation
      forbidden: ["Component", "Screen", "RepositoryImpl", "ApiClient"]
    - id: feature-presentation
      paths: ["src/features/<feature>/presentation"]
      pair_with: feature-api
      forbidden: ["ApiClient", "DataSource", "Dto", "Entity"]
    - id: core-ui
      paths: ["src/core/ui", "src/core/design-system", "src/core/resources"]
    - id: core-network
      paths: ["src/core/network", "src/core/platform", "src/core/permission"]
    - id: navigation-api
      paths: ["src/core/navigation/api"]
    - id: navigation-impl
      paths: ["src/core/navigation/impl"]
artifacts:
  prd: optional
  adr: optional
  slice_plan: required
vocabulary:
  prd: spec
  adr: decision-log
  lore: notes
commit_convention:
  style: conventional
  co_author: skip
pr:
  target_branch: main
  merge_strategy: squash
