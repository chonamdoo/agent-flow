id: nextjs
branching:
  strategy: trunk
  base: main
  integration: main
  worktree: required
  naming:
    prefix: "feat/"
    slug_style: kebab-case
    slug_source: feature title
    max_slug_length: 60
gates:
  - id: context-lint
    command: ["node", "scripts/check-context-docs.mjs"]
    required: true
    phase: pre-commit
  - id: build
    command: ["npm", "run", "build"]
    required: true
    phase: pre-push
  - id: test
    command: ["npm", "test"]
    required: true
    phase: pre-commit
  - id: lint
    command: ["npm", "run", "lint"]
    required: false
    phase: pre-commit
