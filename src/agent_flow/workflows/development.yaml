id: development
description: Personal subagent-first development workflow.
phases:
  - id: explore
    role: explorer
    description: Inspect the task and existing code before editing.
    prompt: |
      Inspect the relevant files and existing patterns. Record the chosen smallest
      implementation path, assumptions, and verification command.
      Output: explore.md.

  - id: implement
    role: implementer
    description: Implement the requested change.
    prompt: |
      Implement the requested change using the existing project patterns. Keep the
      diff scoped to the task and update focused regression coverage when needed.
      Output: implement.md.

  - id: review
    role: reviewer
    parallel: true
    replicas: 3
    description: Review the implementation.
    multi_review: true
    routes:
      approve: qa
      request-changes: fix-loop
    prompt: |
      Run at least two independent sub-agent reviewers in parallel. Each reviewer
      checks bugs, regressions, missing tests, and contract drift.
      Each reviewer section must include `reviewer-source: sub-agent` and an
      independent verdict: approve or request-changes. Any request-changes from
      any reviewer makes the overall verdict request-changes.
      End with `## Overall` followed by exactly one verdict line:
      `verdict: approve` or `verdict: request-changes`.
      Output: review.md.

  - id: qa
    role: qa
    description: Run focused verification.
    routes:
      green: handoff
      approve: handoff
      request-changes: fix-loop
      blocked: fix-loop
      error: fix-loop
      default: fix-loop
    prompt: |
      Run the verification command recorded in explore.md plus any focused checks
      needed for the touched stack. Output `status: green` when verified, or
      `status: request-changes`, `status: blocked`, or `status: error` with the
      exact failure.
      Output: qa.md.

  - id: fix-loop
    role: fixer
    description: Fix review or QA findings.
    routes:
      default: review
    prompt: |
      Fix only the findings from review.md or qa.md. Preserve the original scope
      and update the relevant regression check.
      Output: fix-loop.md.

  - id: handoff
    role: qa
    description: Summarize the completed change.
    prompt: |
      Summarize the change, verification result, and any follow-up risk.
      Output: handoff.md.
