id: review
description: Review-only workflow for existing changes.
phases:
  - id: explore
    description: Inspect the changed files and review context.
    prompt: |
      Inspect the changed files, tests, and relevant project instructions. Record
      the review scope, touched languages, and verification evidence available.
      Output: explore.md.

  - id: review
    skills:
      required: [code-generation-discipline]
    description: Review existing changes.
    multi_review: true
    required_markers:
      - "must-avoid-check: pass|fail|n/a"
    routes:
      approve: handoff
      request-changes: handoff
    prompt: |
      agent-flow already ran the reviewers as confined subprocesses on the
      installed Claude/Codex pool. Do not launch reviewer CLIs yourself:
      aggregate the per-angle artifacts the runner lists. At least two
      independent reviewer processes must cover bugs, regressions, missing
      tests, and contract drift.
      Each reviewer section must include `reviewer-source: sub-agent` and an
      independent verdict: approve or request-changes.
      The Clean Architecture reviewer must record `must-avoid-check: pass|fail`;
      a missing or failing marker blocks approval. That angle only runs when this
      phase requires a clean-architecture skill — the reviewer list the runner
      printed is the fact. When it is absent, record `must-avoid-check: n/a`. Any request-changes from any
      reviewer makes the overall verdict request-changes.
      End with `## Overall` followed by exactly one verdict line:
      `verdict: approve` or `verdict: request-changes`.
      Output: review.md.

  - id: handoff
    description: Summarize the review verdict.
    prompt: |
      Summarize the review verdict and list only actionable findings that remain.
      Output: handoff.md.
