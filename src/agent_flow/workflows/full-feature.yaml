id: full-feature
description: |
  Strict full-feature workflow. This is the canonical agent-flow path:
  domain interview with compact domain map, product validation, PRD, reviewed slice plan,
  DDD/Clean design, TDD implementation, review loops, PR watch, and approved
  merge.

  Routing is enforced by the runner (bin/agent-flow-kit.mjs nextPhaseIndex).
  This YAML is the phase definition source; the runner is the routing authority.

context_policy: ".Codex/rules/context/agent-flow-context-map.md"

phases:
  - id: domain-grill
    description: Interview one question at a time until the domain problem is clear.
    cite_lore: true
    required_markers:
      - "grill-with-docs: complete"
      - "shared_understanding: reached"
      - "context_docs_checked: true"
      - "context_docs_updated: true|not_needed"
    prompt: |
      Run the internal grill-with-docs skill. Ask one question at a time unless
      the codebase or docs already answer it. Challenge terms against CONTEXT.md
      and ADRs, sharpen fuzzy language, stress-test domain relationships with
      concrete scenarios, cross-check user claims against code, update CONTEXT.md
      inline when terms are resolved, create docs lazily, and offer ADRs only for
      hard-to-reverse, surprising trade-off decisions. Before completion,
      normalize the output into a compact domain map and keep expanded detail in
      .Codex/rules/context/ instead of hot CONTEXT.md.

      Do not complete this phase while unresolved questions remain. Only after
      the one-question-at-a-time interview reaches shared understanding, end
      domain-grill.md with a `## Completion Gate` section:

          ## Completion Gate
          grill-with-docs: complete
          shared_understanding: reached
          context_docs_checked: true
          context_docs_updated: true

      If no context doc update is needed, use `context_docs_updated: not_needed`
      and explain why in the artifact.

  - id: product-brief
    description: Validate whether this is worth building.
    prompt: |
      Apply YC office-hours style pressure: target user, painful problem,
      current workaround, why now, narrowest wedge, value, cut list, and
      build/defer/cut decision. Output: product-brief.md.

  - id: prd
    description: Write the product requirements document.
    prompt: |
      Write the PRD from domain-grill.md and product-brief.md. Include goal,
      scope, non-goals, user stories, acceptance criteria, edge cases,
      dependencies, and risks. Output: prd.md.

  - id: slice-plan
    description: Break PRD into independently shippable slices.
    prompt: |
      Create a small-slice implementation plan. Each slice must be testable,
      independently reviewable, and have explicit verification. If architecture
      mode is `ddd`, every slice must declare layer scope using domain,
      application, infrastructure, and presentation. Output: slice-plan.md.

  - id: plan-review
    description: Senior-style plan review gate. Runner routes approve→ddd-design, request-changes→slice-plan.
    routes:
      approve: ddd-design
      request-changes: slice-plan
    prompt: |
      Review slice-plan.md. Check missing steps, wrong order, oversized work,
      vague validation, and hidden dependencies. Output plan-review.md with
      exactly one verdict line: `verdict: approve` or
      `verdict: request-changes`.

  - id: ddd-design
    description: DDD and Clean Architecture design.
    prompt: |
      Design using DDD and Clean Architecture boundaries. If architecture mode
      is `ddd`, the artifact must include Bounded Context, Aggregates,
      Entities, Value Objects, Application Use Cases, Infrastructure Adapters,
      Presentation Routes, Dependency Rule, and Implementation Structure with
      concrete paths/modules for the active stack. If DDD is not appropriate,
      explicitly label the work as `service-layer refactor` instead of DDD.
      Output: ddd-design.md.

  - id: worktree
    description: Create an isolated git worktree for parallel task safety.
    prompt: |
      Run `git worktree add -b feat/<slug> .agent-flow/worktrees/feat-<slug>/ main`
      to create an isolated worktree without switching the leader branch. Do
      not just create a branch — a physical worktree is required for parallel
      task isolation. Do not work on main/master/develop. Follow
      profile.branching.naming when present. Record worktree path, branch name,
      and base commit.
      Output: worktree.md.

  - id: run-start
    description: Record run setup.
    prompt: |
      Record selected profile, branch, provider, task, and run constraints.
      Output: run-start.md.

  - id: red
    description: TDD red phase.
    prompt: |
      Apply code-generation-discipline before writing tests. Write failing
      tests first. Language-specific guide selection follows the
      code-generation-discipline Before Starting checklist. Save the failure
      summary and command output.
      Output: red.md.

  - id: green
    description: TDD green phase.
    prompt: |
      Apply code-generation-discipline. Implement the minimum code to pass red
      tests. Language-specific guide selection follows the
      code-generation-discipline Before Starting checklist.
      New or modified code must include Korean comments. Output: green.md.

  - id: refactor
    description: TDD refactor phase.
    prompt: |
      Apply code-generation-discipline. Refactor only after green. Keep
      behavior stable, language-specific guide selection follows the
      code-generation-discipline Before Starting checklist, keep required
      Korean code comments, and summarize structural changes.
      Output: refactor.md.

  - id: gates
    description: Run project verification gates. Runner routes fail→fix-loop, pass→multi-review.
    routes:
      green: multi-review
      approve: multi-review
      request-changes: fix-loop
      blocked: fix-loop
      error: fix-loop
      pending: block
      default: fix-loop
    prompt: |
      Run build, typecheck, lint, tests, and context lint according to the
      active profile. Docs-only PRs must still run context lint. Save
      structured JSON with a top-level `passed` boolean and a `results` array.
      Output: gates.md.

  - id: multi-review
    description: Run implementation review with at least one independent sub-agent reviewer. Runner routes approve→architecture-review, request-changes→fix-loop.
    multi_review: true
    routes:
      approve: architecture-review
      request-changes: fix-loop
    prompt: |
      Run at least one independent sub-agent reviewer. If the changed scope
      spans multiple areas, split the scope and run one additional reviewer
      sub-agent in parallel. Each reviewer uses code-reviewer.md as basis and
      outputs an independent verdict: approve or request-changes.
      Any request-changes from any reviewer makes the overall verdict
      request-changes. Default reviewer is an active-host sub-agent (Codex
      sub-agent in Codex, Claude sub-agent in Claude). Claude/Gemini are
      optional when available. Provider failure falls back to active-host
      sub-agents only. Each reviewer section must include
      `reviewer-source: sub-agent`. After recording each sub-agent result,
      close that sub-agent session. Record per-reviewer verdicts and end with
      `## Overall` followed by exactly one verdict line: `verdict: approve` or
      `verdict: request-changes`.
      Apply agent-flow-concise-output: one finding per line, Korean concise
      prose, no emoji, and parser verdict markers unchanged.
      Output: multi-review.md.

  - id: fix-loop
    description: Apply review and gate fixes. Runner always routes back to gates for re-verification.
    routes:
      default: gates
    prompt: |
      Apply code-generation-discipline while fixing review/gate failures. New
      or modified code must include Korean comments. Language-specific guide
      selection follows the code-generation-discipline Before Starting
      checklist, or record that no fixes were required. Output: fix-loop.md.

  - id: architecture-review
    description: Review implementation against DDD/Clean design. Runner routes approve→commit, request-changes→refactor.
    routes:
      approve: commit
      request-changes: refactor
      blocked: refactor
    prompt: |
      Compare code against domain-grill.md and ddd-design.md. Check layer
      violations, repository boundary leaks, naming drift, and dependency
      direction. Output architecture-review.md with exactly one verdict line:
      `verdict: approve`, `verdict: request-changes`, or `verdict: blocked`.
      Apply agent-flow-concise-output for findings and keep verdict markers
      unchanged.

  - id: commit
    description: Commit verified changes.
    prompt: |
      Commit the verified slice and record commit hashes/messages. Use
      agent-flow-concise-output commit rules: Conventional Commit subject
      target 50 chars, hard cap 72 chars, body only when the reason is unclear.
      Output: commit.md.

  - id: push-pr
    description: Push branch and open PR.
    prompt: |
      Push branch, open PR, and record PR URL, branch, title, and summary.
      Use repo-relative paths only. Output: push-pr.md.

  - id: pr-watch
    description: Watch PR checks and comments. Runner routes green→merge-approval, comments→pr-comment-fix, ci-failed→pr-ci-fix, merged/skipped→handoff.
    routes:
      green: merge-approval
      merged: handoff
      comments: pr-comment-fix
      has_comments: pr-comment-fix
      ci-failed: pr-ci-fix
      ci_failed: pr-ci-fix
      pending: block
      closed: block
      error: block
      skipped: handoff
    prompt: |
      Poll PR status and review threads. Output pr-watch.md with exactly one
      status line: `status: green`, `status: comments`,
      `status: ci-failed`, `status: pending`, `status: merged`,
      `status: skipped`, `status: closed`, or `status: error`.

  - id: pr-comment-fix
    description: Fix actionable PR comments. Runner routes back to pr-watch.
    routes:
      default: pr-watch
    prompt: |
      Address actionable PR review comments, commit, push, resolve the
      corresponding GitHub review threads, and summarize comment/thread IDs,
      fixes, commits, and resolved thread IDs. Output: pr-comment-fix.md.

  - id: pr-ci-fix
    description: Fix failing PR CI. Runner routes back to pr-watch.
    routes:
      default: pr-watch
    prompt: |
      Diagnose failing checks, reproduce locally, fix, commit, push, and
      summarize commands and check URLs. Output: pr-ci-fix.md.

  - id: merge-approval
    description: Require explicit user approval before merge. Runner routes approve→merge.
    routes:
      approve: merge
      default: block
    prompt: |
      Ask the user for explicit merge approval. Do not merge yet. Output
      merge-approval.md with exactly `verdict: approve` only after approval.

  - id: merge
    description: Merge after explicit user approval.
    prompt: |
      Merge only after explicit user approval. Record merge strategy, target
      branch, and merge commit. Output: merge.md.

  - id: handoff
    description: Final handoff and cleanup.
    prompt: |
      Summarize shipped work, verification, PR/merge result, follow-up items,
      and cleanup state. Output: handoff.md.
