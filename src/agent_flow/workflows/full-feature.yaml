id: full-feature
description: |
  Strict full-feature workflow. This is the canonical agent-flow path:
  domain interview with compact domain map, product validation, PRD, reviewed slice plan,
  DDD/Clean design, TDD implementation, review loops, PR watch, and approved
  merge.

  This YAML is the phase definition source. `routes` is parsed and validated by
  src/agent_flow/core/phase_workflow.py; the routing decision and the fix-loop
  round cap belong to the Python runner (src/agent_flow/runner.py). JS relays the
  run lifecycle (start/status/next/advance) to that runner and never advances it.

context_policy: ".Codex/rules/context/agent-flow-context-map.md"

phases:
  - id: domain-grill
    skills:
      required: [grill-with-docs, grilling, domain-modeling]
    description: Interview the user in rounds until the domain problem is clear.
    required_markers:
      - "domain-grill: complete"
      - "shared_understanding: reached"
      - "context_docs_checked: true"
      - "context_docs_updated: true|not_needed"
    required_markers_by_architecture: {}
    prompt: |
      Run `.agent-flow/skills/grill-with-docs/SKILL.md` exactly as written.
      Resolve its `/grilling` and `/domain-modeling` references from
      `.agent-flow/skills/grilling/SKILL.md` and
      `.agent-flow/skills/domain-modeling/SKILL.md`.

      Write the session result to domain-grill.md. When shared understanding is
      reached, end with a `## Completion Gate` section:

          ## Completion Gate
          domain-grill: complete
          shared_understanding: reached
          context_docs_checked: true
          context_docs_updated: not_needed

      If no context doc update is needed, use `context_docs_updated: not_needed`
      and explain why in the artifact.

  - id: product-brief
    skills:
      required: [product-brief]
    description: Validate whether this is worth building.
    prompt: |
      Apply YC office-hours style pressure: target user, painful problem,
      current workaround, why now, narrowest wedge, value, cut list, and
      build/defer/cut decision. Output: artifacts/product-brief.md.

  - id: prd
    skills:
      required: [to-prd]
    description: Write the product requirements document and record supplied design values.
    pause_after: true
    required_markers:
      - "## Spec Items"
      - "spec-items:"
      - "## Design Values"
      - "design-values:"
      - "design-values-confirmed: yes|n/a"
    required_markers_by_architecture: {}
    prompt: |
      Apply `.agent-flow/skills/to-prd/SKILL.md`. Write the PRD
      from domain-grill.md and product-brief.md. Include goal, scope,
      non-goals, user stories, acceptance criteria, edge cases, dependencies,
      and risks. Output: artifacts/prd.md.

      ## Spec Items
      Record every user instruction as one ordered item:

          SPEC-<n>: <requirement>
          verify: test:<name> | symbol:<symbol>=<value> | manual
          due: review | pre-merge

      Every item must have exactly one verifier. Record `spec-items: none` only
      when the run task contains no user instruction.
      `due` is optional and defaults to `review`. Use `pre-merge` only for
      requirements whose evidence depends on publication. A due-only change
      requires the same user confirmation as a requirement or verifier change.

      Do not ask for separate approval of the initial SPEC list. If the list is
      changed later, the workflow status reports only added, modified, and
      deleted items for user confirmation; unchanged baseline items stay active.

      ## Design Values
      Record every concrete value the user supplied as one `key: value` line
      each, using the user's exact value: spacing, sizes, colors, durations,
      counts, thresholds, limits, timeouts. If the input was an image or a
      Figma link, the numbers here are **what you read off it** — a lossy
      reading, not the source. Write them verbatim anyway.

      The runner copies this section and Design Values into `design-spec.md`
      and injects them into every later phase. This ledger is the only carrier
      that survives a compacted conversation, so an omitted instruction or
      value will not reach implementation.

      ## Concerns
      Declare a concern id only when this change touches something the changed
      paths cannot reveal — a layer boundary inside an ordinary wiring file,
      authorization inside an ordinary component. Valid ids are the
      `Declared concern ids` line in this envelope's profile block; an id
      outside that list blocks this phase. A declared concern makes its skills
      required for every later phase, so declare it only with a one-line reason
      here. Add `concerns: <ids>` to the Completion Gate when it applies and
      omit the marker when nothing does.

      ## Read-back
      Before finishing, print the recorded values back to the user as a table
      and ask them to confirm each one. You are the only reader of the image;
      the user is the only one who can tell you that you misread it. Record
      `design-values-confirmed: yes` only after the user answers. Use
      `design-values-confirmed: n/a` **only** when the task carries no supplied
      values at all — never as a shortcut around asking.

      This phase pauses. Confirmation happens during the pause, not after.

  - id: slice-plan
    description: Break PRD into independently shippable slices.
    prompt: |
      Create a small-slice implementation plan. Each slice must be testable,
      independently reviewable, and have explicit verification. Record each
      slice's boundary scope in the selected architecture contract's own terms.
      DDD is a separate modeling axis: record the bounded contexts and domain
      concerns for each slice when DDD is selected.
      Output: artifacts/slice-plan.md.

  - id: plan-review
    skills:
      required: [plan-reviewer]
    description: Senior-style plan review gate. Runner routes approve→ddd-design, request-changes→slice-plan.
    routes:
      approve: ddd-design
      request-changes: slice-plan
    prompt: |
      Review slice-plan.md. Check missing steps, wrong order, oversized work,
      vague validation, and hidden dependencies. Output plan-review.md with
      exactly one verdict line: `verdict: approve` or
      `verdict: request-changes`.

  - id: ddd-design
    architecture_decision: required
    skills:
      required: [ddd-architecture, code-generation-discipline, clean-architecture-core]
    description: DDD first, then selected architecture contract design.
    required_markers:
      - "## Architecture Boundary Map"
      - "architecture-contract: applied"
      - "## Composition Root"
      - "## Testability Boundary"
      - "solid-srp-change-reason:"
      - "solid-ocp-extension-points:"
      - "solid-lsp-contracts:"
      - "solid-isp-consumer-ports:"
      - "solid-dip-dependency-direction:"
    required_markers_by_architecture:
      clean:
        - "## Dependency Rule"
        - "## Use Case Boundaries"
        - "usecase-interface: required|optional|n/a"
        - "usecase-composition: none|domain-service|application-service|orchestrator|justified"
        - "## Repository Boundaries"
        - "## Cache Boundary"
        - "cache-required: yes|no"
        - "memory-cache: required|optional|n/a"
        - "disk-cache: required|optional|n/a"
        - "cache-invalidation-policy:"
        - "## Mapping Boundary"
        - "remote-dto-domain-mapper: required|optional|n/a"
        - "entity-domain-mapper: required|optional|n/a"
        - "domain-ui-mapper: required|optional|n/a"
    prompt: |
      Follow the effective Completion gate below for this run’s selected architecture.
      Clean mode additionally requires every listed Clean boundary heading and marker,
      including all applicability exceptions; local mode assesses its own complete
      contract instead. Pending mode does not authorize structural decisions.
      Apply `.agent-flow/skills/ddd-architecture/SKILL.md` first to model the domain:
      Bounded Context, Ubiquitous Language, Entities, Value Objects,
      Aggregates, Domain Events, Domain Invariants, and Domain Flow.
      Then apply this project's selected architecture contract, including its
      complete root and required references, to define ownership, dependency,
      action composition, persistence, cache, representation, wiring,
      testability, and SOLID decisions. In Clean mode, use its layer,
      UseCase port/impl, and Repository port/adapter rules; local mode uses
      the selected contract's own boundaries instead.
      Use these common selected-contract subsections:
      - `## Architecture Boundary Map`
      - `## Composition Root`
      - `## Testability Boundary`
      If DDD is not appropriate, explicitly label the work as
      `service-layer refactor` and still complete the architecture
      boundary assessment when code boundaries are touched.
      Identify the actual contract and provide boundary evidence from its complete
      normative root and required references; an applied marker alone is not assessment.
      End with:

          ## Completion Gate
          architecture-contract: applied
          solid-srp-change-reason: <summary>
          solid-ocp-extension-points: <summary>
          solid-lsp-contracts: <summary>
          solid-isp-consumer-ports: <summary>
          solid-dip-dependency-direction: <summary>

      Output: artifacts/ddd-design.md.

  - id: worktree
    description: Verify and record the checkout already bound by CLI entry.
    prompt: |
      The CLI already attached or created and prepared this run's physical
      worktree before the first phase. Verify the reported binding and setup;
      do not create another worktree, switch the leader branch, run install,
      or regenerate skill links. Check profile.branching and naming against
      the existing branch and base. Do not work on main/master/develop.
      If binding or setup is missing or inconsistent, stop and report the
      runtime blocker instead of bypassing it with `git worktree add`.
      Record worktree path, branch name, base commit, and setup verification.
      Output: artifacts/worktree.md.

  - id: run-start
    description: Record run setup.
    prompt: |
      Record selected profile, branch, provider, task, and run constraints.
      Output: artifacts/run-start.md.

  - id: red
    skills:
      required: [code-generation-discipline, tdd, codebase-design]
    description: TDD red phase.
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
      - "regression-test:"
      - "red-observed:"
      - "test-run-evidence: verified|unavailable"
    required_markers_by_architecture:
      clean:
        - "presentation-skill: android|flutter|react|react-native|ios|n/a"
    prompt: |
      Follow the effective Completion gate below for this run’s selected architecture.
      Clean mode additionally requires every listed Clean boundary heading and marker,
      including all applicability exceptions; local mode assesses its own complete
      contract instead. Pending mode does not authorize structural decisions.
      Apply code-generation-discipline, `.agent-flow/skills/tdd/SKILL.md`, and
      `.agent-flow/skills/codebase-design/SKILL.md` before writing tests. Write
      failing tests first.

      Then **run them** and let them fail. The run itself is observed by the
      `record-command-run.py` PostToolUse hook, so "I wrote a test" without a
      test command in this phase is rejected regardless of what you record.
      A test that passes on the first run is not a red phase.
      Resolve required skills from active profile metadata,
      `.agent-flow/skills/index.json`, changed files, and task scope. Read only
      the touched profile skill union before writing tests. Unrelated
      platform skill absence must not block. Save the failure summary and
      command output. For missing required skills, follow the Missing Required
      Skills section of `.agent-flow/skills/code-generation-discipline/SKILL.md`.
      End with:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>
          regression-test: <test id that reproduces the required behavior>
          red-observed: <exit code of the failing run>
          test-run-evidence: verified|unavailable

      Use `test-run-evidence: unavailable` only when the host does not run the
      observation hook. When the hook is active the runner reads the log
      directly and your marker value does not decide anything.

      Output: artifacts/red.log.

  - id: green
    skills:
      required: [code-generation-discipline, tdd, clean-architecture-core]
    description: TDD green phase.
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "architecture-contract: applied|n/a"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
    required_markers_by_architecture:
      clean:
        - "presentation-skill: android|flutter|react|react-native|ios|n/a"
        - "presentation-state-based-development: applied|n/a"
        - "presentation-state-review: pass|fail|n/a"
        - "ui-state-modeling: explicit|n/a"
        - "presentation-mapping-boundary: domain-to-uimodel|n/a"
        - "di-boundary: hilt|context-provider|tsyringe|swift-environment|factory|swift-dependencies|swinject|needle|riverpod|get-it|direct|existing|n/a"
    prompt: |
      Follow the effective Completion gate below for this run’s selected architecture.
      Clean mode additionally requires every listed Clean boundary heading and marker,
      including all applicability exceptions; local mode assesses its own complete
      contract instead. Pending mode does not authorize structural decisions.
      Apply code-generation-discipline. Implement the minimum code to pass red
      tests. Apply `.agent-flow/skills/tdd/SKILL.md` and the architecture contract
      skills this prompt lists as required. Apply code-generation-discipline's
      Before Starting skill resolution and Missing Required Skills procedure.
      End with:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          architecture-contract: applied|n/a
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>

      Output: artifacts/green.log.

  - id: refactor
    skills:
      required: [code-generation-discipline, tdd, clean-architecture-core]
    description: TDD refactor phase.
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "architecture-contract: applied|n/a"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
    required_markers_by_architecture:
      clean:
        - "presentation-skill: android|flutter|react|react-native|ios|n/a"
        - "presentation-state-based-development: applied|n/a"
        - "presentation-state-review: pass|fail|n/a"
        - "ui-state-modeling: explicit|n/a"
        - "presentation-mapping-boundary: domain-to-uimodel|n/a"
        - "di-boundary: hilt|context-provider|tsyringe|swift-environment|factory|swift-dependencies|swinject|needle|riverpod|get-it|direct|existing|n/a"
    routes:
      default: comment-authoring
    prompt: |
      Follow the effective Completion gate below for this run’s selected architecture.
      Clean mode additionally requires every listed Clean boundary heading and marker,
      including all applicability exceptions; local mode assesses its own complete
      contract instead. Pending mode does not authorize structural decisions.
      Apply code-generation-discipline. Refactor only after green. Keep
      behavior stable, apply `.agent-flow/skills/tdd/SKILL.md` and the architecture
      contract skills this prompt lists as required, read every required profile skill
      before changing code, and summarize structural changes. Apply
      code-generation-discipline's Before Starting skill resolution and
      Missing Required Skills procedure.
      End with:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          architecture-contract: applied|n/a
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>

      Output: artifacts/refactor.md.

  - id: comment-authoring
    skills:
      required: [comment-authoring-discipline]
    description: Final comment-quality pass before multi-review. Runner routes to multi-review.
    required_markers:
      - "comment-authoring: applied"
      - "comment-checker: checked|unavailable|n/a"
      - "comment-scope: final-pass-only"
      - "refactor-scope: none"
      - "performance-optimization: none"
      - "module-split: none"
    required_markers_by_architecture: {}
    routes:
      default: multi-review
    prompt: |
      Apply `.agent-flow/skills/comment-authoring-discipline/SKILL.md` to the changed diff
      before multi-review. Add no comments by default. Add or keep comments only
      for WHY, external constraints, workarounds, security, performance,
      concurrency/lifecycle, complex algorithms or regex, business/domain rules,
      and public API contracts.

      Remove or rewrite WHAT/HOW comments that restate code. Do not refactor,
      optimize performance, split modules, rename broadly, or expand scope.
      Run comment-checker or the configured hook when available. Record
      `checked` when it ran, `unavailable` only when no project-local
      checker/hook command exists, and `n/a` only when the changed diff has no
      code files to inspect.

      Output: artifacts/comment-authoring.md.
      End with:

          ## Completion Gate
          comment-authoring: applied
          comment-checker: checked|unavailable|n/a
          comment-scope: final-pass-only
          refactor-scope: none
          performance-optimization: none
          module-split: none

  - id: multi-review
    architecture_decision: required
    skills:
      required: [code-generation-discipline, code-review, clean-architecture-core, agent-flow-concise-output]
    description: Run implementation review with at least two independent sub-agent reviewers before approve. Runner routes approve→architecture-review, request-changes→fix-loop.
    multi_review: true
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "architecture-contract-check: pass|fail|n/a"
      - "codex-claude-parity-check: pass|fail"
      - "hook-parity-check: pass|fail"
      - "architecture-contract-review: applied"
      - "must-avoid-check: pass|fail|n/a"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
      - "solid-architecture-check: applied"
    required_markers_by_architecture:
      clean:
        - "presentation-skill: android|flutter|react|react-native|ios|n/a"
        - "presentation-state-review: pass|fail|n/a"
        - "ui-state-modeling: explicit|n/a"
        - "presentation-mapping-boundary: domain-to-uimodel|n/a"
        - "di-boundary: hilt|context-provider|tsyringe|swift-environment|factory|swift-dependencies|swinject|needle|riverpod|get-it|direct|existing|n/a"
        - "usecase-interface-check: applied"
        - "usecase-composition-check: applied"
        - "cache-boundary-check: applied"
        - "mapping-boundary-check: applied"
    routes:
      approve: architecture-review
      request-changes: fix-loop
    prompt: |
      Follow the effective Completion gate below for this run’s selected architecture.
      Clean mode additionally requires every listed Clean boundary heading and marker,
      including all applicability exceptions; local mode assesses its own complete
      contract instead. Pending mode does not authorize structural decisions.
      agent-flow already ran this phase's reviewers as confined subprocesses on
      the installed Claude/Codex pool. Do not launch reviewer CLIs yourself:
      read the per-angle artifacts the runner lists and aggregate them. At least
      two independent reviewer processes must have produced a verdict from the
      explicit per-angle templates and required skills injected in their prompts.
      For architecture/SOLID findings, reviewers apply the full selected
      architecture contract injected in their own prompts. Any applicable
      must-avoid violation or failed required criterion makes the overall
      verdict `request-changes`. Applied markers alone are not assessment.
      Any request-changes from any reviewer makes the overall verdict
      request-changes. Reviewers are installed Claude and Codex CLIs only.
      Never use OMP or controller-session work as a reviewer fallback. Each
      reviewer section must include `reviewer-source: sub-agent`. Record
      per-reviewer verdicts.
      Apply agent-flow-concise-output: one finding per line, concise
      prose, no emoji, and parser verdict markers unchanged.
      Apply code-generation-discipline's Before Starting skill resolution and
      Missing Required Skills procedure for this host.
      The markers below are not the whole completion contract. The runner also
      verifies this run's `design-spec.md` ledger at this phase, and
      `verdict: approve` does not override it — an unmet review-due item blocks
      phase completion and publication. Explicit pre-merge items remain pending,
      not satisfied. Every due item needs the evidence its `verify:` declares:
        - `test:<name>` — an observed test command that ran that name and exited 0
        - `symbol:<symbol>=<value>` — the value added in a changed file that
          contains the symbol
        - `manual` — explicit user confirmation in chat, followed by the agent
          recording it with `agent-flow spec approve`
      Before merge or merge approval, the runner rechecks every item, including
      review-due items. For pre-merge manual items, first meet the recorded
      prerequisites on the current published HEAD, then obtain user confirmation
      and record it. A HEAD change requires fresh approval.
      Recorded design values must appear in the diff. When a value reaches the
      code through a token, declare it as
      `design-values-implemented: <key>=<token>` and that token must be in the
      diff.
      Include the Completion Gate before the final Overall section:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          architecture-contract-check: pass|fail|n/a
          codex-claude-parity-check: pass|fail
          hook-parity-check: pass|fail
          architecture-contract-review: applied
          must-avoid-check: pass|fail|n/a
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>
          solid-architecture-check: applied

      Output: artifacts/multi-review.md.
      End with `## Overall` followed by exactly one verdict line:
      `verdict: approve` or `verdict: request-changes`.

  - id: architecture-review
    architecture_decision: required
    skills:
      required: [code-generation-discipline, ddd-architecture, clean-architecture-core, architecture-reviewer]
    description: Review implementation against domain and selected architecture design. Runner routes approve→gates, request-changes→refactor.
    multi_review: true
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "architecture-contract-check: pass|fail|n/a"
      - "codex-claude-parity-check: pass|fail"
      - "hook-parity-check: pass|fail"
      - "architecture-contract: applied|n/a"
      - "must-avoid-check: pass|fail|n/a"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
      - "solid-boundary-check: pass|fail"
    required_markers_by_architecture:
      clean:
        - "shared-presentation-contract-placement: pass|fail|n/a"
        - "dependency-rule: pass|fail"
        - "usecase-boundary: pass|fail|n/a"
        - "usecase-calls-usecase: pass|fail|n/a"
        - "repository-boundary: pass|fail"
        - "cache-boundary: pass|fail|n/a"
        - "memory-disk-cache-separated: pass|fail|n/a"
        - "mapping-boundary: pass|fail|n/a"
        - "dto-entity-domain-ui-separated: pass|fail"
        - "presentation-skill: android|flutter|react|react-native|ios|n/a"
        - "presentation-state-review: pass|fail|n/a"
        - "ui-state-modeling: explicit|n/a"
        - "presentation-mapping-boundary: domain-to-uimodel|n/a"
        - "di-boundary: hilt|context-provider|tsyringe|swift-environment|factory|swift-dependencies|swinject|needle|riverpod|get-it|direct|existing|n/a"
    routes:
      approve: gates
      request-changes: refactor
    prompt: |
      Follow the effective Completion gate below for this run’s selected architecture.
      Clean mode additionally requires every listed Clean boundary heading and marker,
      including all applicability exceptions; local mode assesses its own complete
      contract instead. Pending mode does not authorize structural decisions.
      agent-flow already ran this phase's reviewers as confined subprocesses on
      the installed Claude/Codex pool before QA. Do not launch reviewer CLIs
      yourself: aggregate the per-angle artifacts the runner lists. Two
      independent reviewer processes are required and each reviewer section must
      include `reviewer-source: sub-agent`. A failed required reviewer process
      blocks approval and must never be replaced by OMP or controller-session
      work.
      Compare code against domain-grill.md and ddd-design.md. Check naming
      drift and the selected contract's ownership and dependency rules.
      Apply `.agent-flow/skills/ddd-architecture/SKILL.md` first for domain fit,
      then the full architecture contract and required references injected in
      this prompt for boundaries and SOLID validation. Clean-specific layer
      and repository checks apply in Clean mode. Any applicable must-avoid
      violation or failed required criterion makes the verdict `request-changes`
      for that reviewer. Any request-changes
      from either reviewer makes the overall verdict request-changes.
      Output architecture-review.md with each reviewer section.
      Apply agent-flow-concise-output for findings and keep verdict markers
      unchanged.
      Apply code-generation-discipline's Before Starting skill resolution and
      Missing Required Skills procedure before judging code.
      Include the Completion Gate before the final Overall section:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          architecture-contract-check: pass|fail|n/a
          codex-claude-parity-check: pass|fail
          hook-parity-check: pass|fail
          architecture-contract: applied|n/a
          must-avoid-check: pass|fail|n/a
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>
          solid-boundary-check: pass|fail

      End with `## Overall` followed by exactly one verdict line:
      `verdict: approve` or `verdict: request-changes`.

  - id: gates
    description: Runner runs the profile gates itself after reviewer approve. Routes fail→fix-loop, pass→commit.
    artifact: artifacts/gate-results.json
    routes:
      green: commit
      approve: commit
      request-changes: fix-loop
      blocked: fix-loop
      error: fix-loop
      pending: block
      default: fix-loop
    prompt: |
      The runner runs this phase's gates itself and writes the result file. Do
      not run `agent-flow gates` here and do not author the result file: the
      verification result must not be written by the party being verified.
      Gates come from the active profile at `--phase all`. Gates whose
      `execution` is `local` run here; `execution: ci` gates are recorded as
      deferred and must pass in the pull-request checks observed by `pr-watch`.
      Per-gate limits come from `gates[].timeout_s`; a gate that needs longer
      declares it there rather than being recorded as a timeout, which means
      "verification was cut off", not "the build is broken".
      `agent-flow gates` remains available for focused reproduction.
      Output: artifacts/gate-results.json.

  - id: fix-loop
    skills:
      required: [code-generation-discipline, clean-architecture-core]
    description: Apply review and gate fixes. Runner routes back to review before QA.
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "architecture-contract: applied|n/a"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
    required_markers_by_architecture:
      clean:
        - "presentation-skill: android|flutter|react|react-native|ios|n/a"
        - "presentation-state-based-development: applied|n/a"
        - "presentation-state-review: pass|fail|n/a"
        - "ui-state-modeling: explicit|n/a"
        - "presentation-mapping-boundary: domain-to-uimodel|n/a"
        - "di-boundary: hilt|context-provider|tsyringe|swift-environment|factory|swift-dependencies|swinject|needle|riverpod|get-it|direct|existing|n/a"
    routes:
      default: comment-authoring
    prompt: |
      Follow the effective Completion gate below for this run’s selected architecture.
      Clean mode additionally requires every listed Clean boundary heading and marker,
      including all applicability exceptions; local mode assesses its own complete
      contract instead. Pending mode does not authorize structural decisions.
      Apply code-generation-discipline while fixing review/gate failures. Read
      required profile skills before writing or judging code, or record that no
      fixes were required. Apply the required architecture contract skills to any
      boundary-affecting fix. Apply code-generation-discipline's Before Starting
      skill resolution and Missing Required Skills procedure.
      End with:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          architecture-contract: applied|n/a
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>

      Output: artifacts/fix-loop.md.

  - id: commit
    skills:
      required: [agent-flow-concise-output]
    required_markers:
      - "commit-oid:"
      - "commit-subject:"
    required_markers_by_architecture: {}
    description: Commit verified changes.
    prompt: |
      Commit the verified slice. Use agent-flow-concise-output commit rules:
      Conventional Commit subject target 50 chars, hard cap 72 chars, body
      only when the reason is unclear. Record exactly one full current HEAD
      OID and its exact subject as `commit-oid: <oid>` and
      `commit-subject: <subject>`. Output: artifacts/commit.md.

  - id: push-pr
    skills:
      required: [agent-flow-concise-output]
    required_markers:
      - "remote:"
      - "branch:"
      - "remote-oid:"
      - "pr-url:"
      - "pr-base:"
    required_markers_by_architecture: {}
    description: Push branch and create or reuse its PR.
    prompt: |
      Before drafting or refreshing the PR body, apply agent-flow-concise-output
      and the PR descriptions mode in write-for-work.
      Locate the current branch's PR in the intended repository with
      `gh pr list --repo <repo> --head <branch> --state all`, including on
      reentry after a PR fix, review, gates, and commit. Reuse its number and
      URL; never create a duplicate. If lookup fails or multiple PRs match,
      stop and resolve the identity rather than treating it as no PR.
      If the PR is already merged or closed, preserve that identity and
      follow the pr-watch terminal-state contract; do not open a replacement
      or claim unpublished current-HEAD evidence.
      For an open PR, verify its base is `profile.pr.target_branch`, push the
      reviewed current HEAD to its existing branch, and refresh its body.
      Only when a successful lookup confirms no branch PR exists, push and
      create one against `profile.pr.target_branch`. Refresh `remote:`,
      `branch:`, `remote-oid:`, HTTPS `pr-url:`, and `pr-base:` from the actual
      remote and PR; verify the remote branch OID and PR head both equal
      current HEAD. Do not reuse stale push evidence after a fix.
      Record the title and summary using repo-relative paths only.
      Output: artifacts/push-pr.md.

  - id: pr-watch
    skills:
      required: [push-watch]
    description: Watch PR checks and comments. Runner routes green→merge-approval, comments→pr-comment-fix, ci-failed→pr-ci-fix, merged/skipped→handoff.
    routes:
      green: merge-approval
      merged: handoff
      comments: pr-comment-fix
      has_comments: pr-comment-fix
      ci-failed: pr-ci-fix
      ci_failed: pr-ci-fix
      pending: block
      closed: block
      error: block
      skipped: handoff
    prompt: |
      Run `agent-flow pr-watch <number> --run-dir <run-dir> --once`.
      Preserve the observed repo, PR number, head, feedback IDs, and check URLs.
      Do not fix or acknowledge feedback in this observation phase.
      Output pr-watch.md with exactly one observed status line:
      `status: green`, `status: comments`, `status: ci-failed`,
      `status: pending`, `status: merged`, `status: skipped`,
      `status: closed`, or `status: error`.

  - id: pr-comment-fix
    skills:
      required: [push-watch, code-generation-discipline, clean-architecture-core]
    description: Address PR feedback; changed code returns through review and gates.
    routes:
      blocked: block
      default: pr-watch
    prompt: |
      Apply `.agent-flow/skills/push-watch/SKILL.md` triage and deferred
      completion policy, including on reentry after publication.
      Output: artifacts/pr-comment-fix.md with completed/deferred feedback IDs,
      responses, fixes, thread URLs, and publication evidence, or
      `status: blocked` with the required human decision.

  - id: pr-ci-fix
    skills:
      required: [push-watch, code-generation-discipline, clean-architecture-core]
    description: Fix PR CI; changed code returns through review and gates.
    routes:
      blocked: block
      default: pr-watch
    prompt: |
      Apply `.agent-flow/skills/push-watch/SKILL.md` triage and CI repair
      policy. Output: artifacts/pr-ci-fix.md with check identities, commands
      actually run, fixes, and log URLs, or `status: blocked` with the
      required human decision.

  - id: merge-approval
    description: Require explicit user approval before merge. Runner routes approve→merge.
    routes:
      approve: merge
      default: block
    prompt: |
      Entry requires evidence for all confirmed SPEC items, including pre-merge
      items. SPEC approval and merge approval remain separate authorizations.
      Ask the user for explicit merge approval. Do not merge yet. Output
      merge-approval.md with exactly `verdict: approve` only after approval.

  - id: merge
    skills:
      optional: [resolving-merge-conflicts]
    description: Merge after explicit user approval.
    prompt: |
      Entry rechecks every confirmed SPEC item against the current publication.
      Merge only after explicit user approval. If the merge or rebase hits
      conflicts, apply `.agent-flow/skills/resolving-merge-conflicts/SKILL.md` before
      completing. Record merge strategy, target branch, and merge commit.
      Output: artifacts/merge.md.

  - id: handoff
    description: Final handoff before Runner-owned transactional cleanup.
    prompt: |
      Summarize shipped work, verification, PR/merge result, follow-up items,
      and the expected integration target in artifacts/handoff.md. Do not
      delete the branch, worktree, runtime metadata, or `active` marker.
      Runner performs and proves every cleanup transaction step after handoff;
      this artifact alone cannot make the run terminally complete.
