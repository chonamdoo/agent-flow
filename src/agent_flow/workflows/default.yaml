id: default
description: |
  Single full-cycle workflow applied to every project. The chain unifies
  interview / docs / DDD / Clean Architecture / SOLID into one design phase,
  then enforces TDD (test-first) implementation. AI infers depth per task —
  trivial fixes collapse phases, feature work expands them — but the order
  is invariant.

  Phase order (canonical):
    design → slice-plan → [pause]
    → worktree → implement (TDD red→green→refactor inside, per slice)
    → comment-authoring → final-review → gates ↔ fix-loop → comment-authoring → final-review → gates
    → commit → push-pr → pr-watch ↔ pr-comment-fix/pr-ci-fix → merge → cleanup

phases:
  - id: design
    skills:
      required: [grill-with-docs, grilling, domain-modeling, ddd-architecture, clean-architecture, clean-architecture-core]
    description: |
      Unified design phase. Grill-style interview → docs → DDD model → Clean
      Architecture layer map → SOLID check. Single artifact captures the
      shared understanding plus the architectural blueprint. Mandatory for
      every project.
    cite_lore: true
    required_markers:
      - "## Clean Architecture Boundary Map"
      - "## Dependency Rule"
      - "## Use Case Boundaries"
      - "usecase-interface: required|optional|n/a"
      - "usecase-composition: none|domain-service|application-service|orchestrator|justified"
      - "## Repository Boundaries"
      - "## Cache Boundary"
      - "cache-required: yes|no"
      - "memory-cache: required|optional|n/a"
      - "disk-cache: required|optional|n/a"
      - "cache-invalidation-policy:"
      - "## Mapping Boundary"
      - "remote-dto-domain-mapper: required|optional|n/a"
      - "entity-domain-mapper: required|optional|n/a"
      - "domain-ui-mapper: required|optional|n/a"
      - "## Composition Root"
      - "## Testability Boundary"
      - "solid-srp-change-reason:"
      - "solid-ocp-extension-points:"
      - "solid-lsp-contracts:"
      - "solid-isp-consumer-ports:"
      - "solid-dip-dependency-direction:"
      - "## Spec Items"
      - "spec-items:"
      - "## Design Values"
      - "design-values:"
    prompt: |
      Produce the unified design document. Sections in order:

      ## 1. Interview (grill-with-docs + domain-modeling)
      Interview the user one question at a time. Walk every branch of the
      decision tree. Provide your recommended answer for each question. If
      the codebase can answer a question, search the codebase rather than
      asking. Challenge terms against CONTEXT.md and ADRs, cross-check user
      claims against code, and update docs inline when terms are resolved.
      Continue until you reach shared understanding of: scope, acceptance
      criteria, edge cases, non-goals, dependencies, constraints. Trivial tasks
      may collapse to a single confirmation; feature work expands.

      ## 2. Spec (renamed per profile.vocabulary)
      Goal, in-scope, out-of-scope, acceptance criteria, observable behavior,
      dependencies, open risks. If a "Relevant lore" block was injected into
      this prompt envelope (auto-cited from `.agent-flow/memory/lore/`),
      cite the entries that actually apply by relative path. Ignore unrelated
      entries and never fabricate citations for lore that wasn't surfaced.

      ## 3. DDD model
      Apply `skills/ddd-architecture/SKILL.md` first.
      - Aggregates (and consistency boundaries)
      - Bounded contexts touched (cross-context translations explicit)
      - Ubiquitous language terms (introduced or refined; mark which are new)
      - Domain events (past tense, minimal payload)
      For trivial / non-domain changes (config, cosmetic), explicitly note
      "no domain model impact" and explain.

      ## 4. Clean Architecture layer map
      Apply `skills/clean-architecture/SKILL.md` after the DDD model.
      Map every proposed change to: domain / usecase / data / presentation.
      For each layer touched, list:
      - Concrete additions (new types, new methods)
      - Modifications to existing types
      - Cross-layer interfaces affected
      Verify dependency direction: inner layers must not import from outer.
      Reject any design that creates outward dependency from domain.
      Include these subsections exactly:
      - `## Clean Architecture Boundary Map`
      - `## Dependency Rule`
      - `## Use Case Boundaries`
      - `## Repository Boundaries`
      - `## Cache Boundary`
      - `## Mapping Boundary`
      - `## Composition Root`
      - `## Testability Boundary`

      ## 5. SOLID check
      For each new class/module/function, verify:
      - **S**ingle Responsibility: does it have exactly one reason to change?
      - **O**pen/Closed: extension via composition/strategy, modification
        avoided?
      - **L**iskov: subtypes preserve supertype contracts (no surprise nulls,
        no narrower preconditions)?
      - **I**nterface Segregation: clients depend only on methods they use?
      - **D**ependency Inversion: depend on abstractions, not concretions?
      List violations with the offending name and which principle. If none
      apply (e.g. one-line config change), note "n/a — change does not
      introduce new abstractions" and explain.

      ## 6. Decision log (if applicable)
      If the design introduces or revisits an architectural decision, record
      it as Constraint / Rejected / Directive (matches lore schema). Skip
      otherwise.

      ## Spec Items
      Record every user instruction as one ordered item:

          SPEC-<n>: <requirement>
          verify: test:<name> | symbol:<symbol>=<value> | manual

      Every item must have exactly one verifier. Use `spec-items: none` only
      when the run task contains no user instruction.

      After writing `design.md`, show the user the complete ordered SPEC list
      and ask them to reply exactly `승인` in the current chat. Do not treat
      quoted text, an earlier message, or agent-authored text as approval. The
      managed user-prompt hook records only the current exact reply. If that
      host hook is unavailable, tell the user to run the short fallback
      `agent-flow spec confirm` from the target worktree. Never run the fallback
      or invoke the approval hook yourself. The confirmation covers the complete
      ordered set; any requirement or verifier edit requires a new confirmation
      before this phase can complete.

      ## Design Values
      Record every concrete value the user supplied as one `key: value` line
      each, using the user's exact value: spacing, sizes, colors, durations,
      counts, thresholds, limits, timeouts. If the input was an image or a
      Figma link, write the values you read off it verbatim. If the task
      carries no such values, leave the section empty and record
      `design-values: none`.

      The runner copies this section and Design Values into `design-spec.md`
      and injects them into every later phase. This ledger is the only carrier
      that survives a compacted conversation, so an omitted instruction or
      value will not reach implementation.

      Output: design.md (single artifact, all eight sections).
      End with:

          ## Completion Gate
          usecase-interface: required|optional|n/a
          usecase-composition: none|domain-service|application-service|orchestrator|justified
          cache-required: yes|no
          memory-cache: required|optional|n/a
          disk-cache: required|optional|n/a
          cache-invalidation-policy: <policy or n/a>
          remote-dto-domain-mapper: required|optional|n/a
          entity-domain-mapper: required|optional|n/a
          domain-ui-mapper: required|optional|n/a
          solid-srp-change-reason: <summary>
          solid-ocp-extension-points: <summary>
          solid-lsp-contracts: <summary>
          solid-isp-consumer-ports: <summary>
          solid-dip-dependency-direction: <summary>
          spec-items: <comma-separated SPEC ids recorded above, or none>
          design-values: <comma-separated keys recorded above, or none>

  - id: slice-plan
    description: Decompose the design into TDD-ready slices (≤50% context each).
    pause_after: true
    prompt: |
      Decompose design.md into ordered slices. Each slice must be
      implementable within ~50% of the context window. Each slice declares:
      - goal (one sentence, domain-meaningful per ubiquitous language)
      - layer scope (domain / usecase / data / presentation, or combination)
      - aggregates touched
      - test cases that will drive the upcoming TDD red phase (translate
        acceptance criteria into specific test names)
      - files expected to change
      - verification command (profile gate)
      For trivial tasks one slice is fine. Output: slice-plan.md.
      The chain pauses here for user review of design.md + slice-plan.md.

  - id: worktree
    description: Create an isolated git worktree per profile.branching strategy.
    prompt: |
      Create the working branch per profile.branching:
        - release-first: branch from active release/* and target release for PR
        - trunk: branch from main and target main
        - gitflow: branch per gitflow rules
      If profile.branching.naming is present, the branch name MUST follow it:
        - `<prefix><slug>` where prefix and slug_style come from the profile.
        - slug is derived from the configured slug_source and converted to slug_style.
        - truncate to max_slug_length without breaking words.
      Create the worktree with `agent-flow worktree create --name feat-<slug>`
      before implementation — not with `git worktree add`, which skips the
      creation lock, base selection, and the adoption record. The default
      location is `~/.agent-flow/worktrees/<repo-id>/feat-<slug>/` and the
      default branch naming is `feat/<slug>`. Do not continue from the leader
      checkout.
      Output: worktree.md (branch name, base, worktree path).

  - id: implement
    skills:
      required: [code-generation-discipline, tdd, clean-architecture]
      optional: [codebase-design]
    description: |
      TDD-driven implementation. For each slice, run the full red → green →
      refactor cycle in order, then move to the next slice. Single artifact
      records the complete loop per slice. Mandatory test-first; production
      code is never written before a failing test exists.
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "clean-architecture: applied"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
      - "presentation-skill: android|react|react-native|ios|n/a"
      - "presentation-state-based-development: applied|n/a"
      - "presentation-state-review: pass|n/a"
      - "ui-state-modeling: explicit|n/a"
      - "presentation-mapping-boundary: domain-to-uimodel|n/a"
      - "di-boundary: hilt|context-provider|tsyringe|swift-environment|factory|swift-dependencies|swinject|needle|direct|existing|n/a"
    prompt: |
      For each slice in slice-plan.md, in order, run the TDD cycle:

      ### RED — failing tests first
      1. Translate the slice's acceptance criteria into test cases.
      2. Tests target the layer declared by the design's Clean Architecture
         map (domain test for domain logic, usecase test for orchestration,
         data test for repository / mapper).
      3. Tests use ubiquitous language from the DDD section (aggregate
         names, event names) — not technical jargon.
      4. Run tests. They MUST fail with assertion errors (not compile
         errors, not import errors). If compilation fails, fix compile
         issues — but do NOT add any production code that would satisfy
         the assertion.

      ### GREEN — minimum production code
      5. Implement only what the failing tests demand. No "while I'm here"
         additions. No speculative abstractions.
      6. Apply `skills/clean-architecture/SKILL.md` and honor layer assignment
         from the design's Clean Architecture map.
      6a. Resolve required skills from active profile metadata, installed skill
          index, changed files, and task scope. Load only the touched profile
          skill union. Android/Kotlin/Compose/KMP files require Android profile
          skills, `android-code-review`, and the skills this phase prompt lists
          for the change; React Native `android/` native changes also apply
          Android profile mapping. If required skills are missing, report
          `missing local <group>: <skill>` with the source URL and do not claim
          completion without user override.
      7. Honor SOLID principles from the design's SOLID section.
      8. For any data layer work, enforce the repository boundary from
         `skills/clean-architecture/SKILL.md`:
            - Repository interface is the domain/application port.
            - Repository implementation is the data/infrastructure adapter.
            - Repository is the single source of truth.
            - DTOs, DB entities, data sources, and cache implementations do
              not escape the data layer.
            - Mappers convert at the relevant boundary.
         For Android profile work, also apply
         `skills/android-guides/references/data-layer-guide.md`.
      9. Run tests. All must PASS.
      10. Run focused implementation tests needed to prove the slice behavior.
          Completion QA gates run only after final-review approve.

      ### REFACTOR — tests stay green
      11. Apply ubiquitous-language renaming if names drifted from the
          design.
      12. Extract methods / classes only where the same code appears 3+
          times or where naming clarifies intent.
      13. Tighten layer boundaries; move misplaced code.
      14. Re-check SOLID; address any newly-emerged violations.
      15. Re-run tests after each refactor — must remain green.
      16. Do not add features. Do not add tests in this step.

      Output: implement.md
      For each slice include:
        - slice id and goal
        - RED: test files added, failure messages
        - GREEN: production files added, test results
        - REFACTOR: notable renames / extractions, post-refactor test run

      Before writing implement.md, append:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          clean-architecture: applied
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>
          presentation-skill: n/a
          presentation-state-based-development: n/a
          presentation-state-review: n/a
          ui-state-modeling: n/a
          presentation-mapping-boundary: n/a
          di-boundary: n/a

  - id: comment-authoring
    skills:
      required: [comment-authoring-discipline]
    description: Final comment-quality pass before final-review. Runner routes to final-review.
    required_markers:
      - "comment-authoring: applied"
      - "comment-checker: checked|unavailable|n/a"
      - "comment-scope: final-pass-only"
      - "refactor-scope: none"
      - "performance-optimization: none"
      - "module-split: none"
    routes:
      default: final-review
    prompt: |
      Apply `skills/comment-authoring-discipline/SKILL.md` to the changed diff
      before final-review. Add no comments by default. Add or keep comments only
      for WHY, external constraints, workarounds, security, performance,
      concurrency/lifecycle, complex algorithms or regex, business/domain rules,
      and public API contracts.

      Remove or rewrite WHAT/HOW comments that restate code. Do not refactor,
      optimize performance, split modules, rename broadly, or expand scope.
      Run comment-checker or the configured hook when available. Record
      `checked` when it ran, `unavailable` only when no project-local
      checker/hook command exists, and `n/a` only when the changed diff has no
      code files to inspect.

      Output: comment-authoring.md.
      End with:

          ## Completion Gate
          comment-authoring: applied
          comment-checker: checked|unavailable|n/a
          comment-scope: final-pass-only
          refactor-scope: none
          performance-optimization: none
          module-split: none

  - id: final-review
    skills:
      required: [code-generation-discipline, code-review, architecture-reviewer, clean-architecture, clean-architecture-core]
    description: |
      Final review. Requires at least two independent active-host reviewer
      sub-agents launched in OS-confined subprocesses before approve. Profiles
      add stack-specific specialists on top.
    multi_review: true
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "architecture-contract-check: pass|fail|n/a"
      - "codex-claude-parity-check: pass|fail"
      - "hook-parity-check: pass|fail"
      - "clean-architecture: applied"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
      - "dependency-rule: pass|fail"
      - "usecase-boundary: pass|fail|n/a"
      - "usecase-calls-usecase: pass|fail"
      - "repository-boundary: pass|fail"
      - "cache-boundary: pass|fail|n/a"
      - "memory-disk-cache-separated: pass|fail|n/a"
      - "mapping-boundary: pass|fail|n/a"
      - "dto-entity-domain-ui-separated: pass|fail"
      - "solid-boundary-check: pass|fail"
      - "clean-architecture-review: applied"
      - "usecase-interface-check: applied"
      - "usecase-composition-check: applied"
      - "cache-boundary-check: applied"
      - "mapping-boundary-check: applied"
      - "solid-clean-architecture-check: applied"
      - "presentation-skill: android|react|react-native|ios|n/a"
      - "presentation-state-review: pass|fail|n/a"
      - "ui-state-modeling: explicit|n/a"
      - "presentation-mapping-boundary: domain-to-uimodel|n/a"
      - "di-boundary: hilt|context-provider|tsyringe|swift-environment|factory|swift-dependencies|swinject|needle|direct|existing|n/a"
    routes:
      approve: gates
      request-changes: fix-loop
    prompt: |
      Spawn at least two active-host reviewer sub-agents (Codex sub-agent in
      Codex, Claude sub-agent in Claude, OMP sub-agent in OMP) in parallel
      through agent-flow's verified OS-confined subprocess boundary. Additional
      non-host providers are optional extras when available:
        - Generalist (templates/_shared/review/architecture.md)
        - Architecture-design specialist (templates/_shared/review/architecture-design.md) — MANDATORY
        - Clean Architecture specialist (templates/_shared/review/clean-architecture.md) — MANDATORY
        - Plus angles declared in profile.review_angles
      Never replace a failed subprocess with controller-session work. Each
      reviewer section must include `reviewer-source: sub-agent`. After
      recording each sub-agent result, close that sub-agent session. Aggregate
      findings into final-review.md with severity (must-fix /
      should-fix / note) and source angle. Cite paths as `path/to/file:line`.
      Apply agent-flow-concise-output: one finding per line, Korean concise
      prose, no emoji, and parser verdict markers unchanged.
      Resolve required review skills from active profile metadata,
      `.agent-flow/skills/index.json`, changed files, and task scope. Review
      only the touched profile skill union and record `skills_checked: true`.
      If `skills/clean-architecture-core/SKILL.md` is not applied after
      compatibility markers from `skills/clean-architecture/SKILL.md`, or any
      must-avoid or failing checklist condition from the core skill is present,
      the overall verdict is `verdict: request-changes`.
      Android/Kotlin/Compose/KMP changes require Android profile skills,
      `android-code-review`, and the skills this phase prompt lists for the
      change; React Native `android/` native changes also apply Android profile
      mapping. If required skills are missing, report
      `missing local <group>: <skill>` with the source URL and use
      `verdict: request-changes`. Unrelated platform skill absence must not
      block.
      The markers below are not the whole completion contract. The runner also
      verifies this run's `design-spec.md` ledger at this phase, and
      `verdict: approve` does not override it — an unmet item blocks phase
      completion. Every SPEC item needs evidence in the form its `verify:`
      declares:
        - `test:<name>` — an observed test command that ran that name and exited 0
        - `symbol:<symbol>=<value>` — the value added in a changed file that
          contains the symbol
        - `manual` — a user approval record, which only the user can create with
          `agent-flow spec approve`
      Recorded design values must appear in the diff. When a value reaches the
      code through a token, declare it as
      `design-values-implemented: <key>=<token>` and that token must be in the
      diff.
      End with `## Overall` followed by exactly one verdict line: `verdict: approve` or
      `verdict: request-changes`.
      Also include:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          architecture-contract-check: pass|fail|n/a
          codex-claude-parity-check: pass|fail
          hook-parity-check: pass|fail
          clean-architecture: applied
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>
          dependency-rule: pass|fail
          usecase-boundary: pass|fail|n/a
          usecase-calls-usecase: pass|fail
          repository-boundary: pass|fail
          cache-boundary: pass|fail|n/a
          memory-disk-cache-separated: pass|fail|n/a
          mapping-boundary: pass|fail|n/a
          dto-entity-domain-ui-separated: pass|fail
          solid-boundary-check: pass|fail
          clean-architecture-review: applied
          usecase-interface-check: applied
          usecase-composition-check: applied
          cache-boundary-check: applied
          mapping-boundary-check: applied
          solid-clean-architecture-check: applied
          presentation-skill: n/a
          presentation-state-review: n/a
          ui-state-modeling: n/a
          presentation-mapping-boundary: n/a
          di-boundary: n/a

  - id: gates
    description: Run project verification gates after final-review approve. Runner routes fail→fix-loop, pass→commit.
    artifact: artifacts/gate-results.json
    routes:
      green: commit
      approve: commit
      request-changes: fix-loop
      blocked: fix-loop
      error: fix-loop
      pending: block
      default: fix-loop
    prompt: |
      Run QA only after required reviewers approve. Run the profile gates with
      `agent-flow gates --phase all --run-dir <run-dir>`, plus context lint.
      `--phase all` is required: the CLI default is `pre-commit`, build and test
      gates are declared `pre-push`, and a default run never puts them on the
      list. The runner reads `produced_by.gate_phase` from the result file and
      does not accept a `pre-commit` run as passing QA evidence.
      Docs-only PRs must still run context lint. Save structured JSON with a
      top-level `passed` boolean and a `results` array. When an explicit route
      status is needed, also include top-level `status` as `green`, `approve`,
      `request-changes`, `blocked`, `error`, or `pending`.
      Output: artifacts/gate-results.json.

  - id: fix-loop
    skills:
      required: [code-generation-discipline, clean-architecture]
    description: Address review findings. Tests stay green.
    required_markers:
      - "skills_checked: true"
      - "profile-skill-selection: applied"
      - "active-profiles:"
      - "changed-file-skill-resolution: applied"
      - "required-profile-skills: checked"
      - "missing-required-profile-skills:"
      - "clean-architecture: applied"
      - "project-local-skills: checked|n/a"
      - "project-local-skills-used:"
      - "presentation-skill: android|react|react-native|ios|n/a"
      - "presentation-state-based-development: applied|n/a"
      - "presentation-state-review: pass|n/a"
      - "ui-state-modeling: explicit|n/a"
      - "presentation-mapping-boundary: domain-to-uimodel|n/a"
      - "di-boundary: hilt|context-provider|tsyringe|swift-environment|factory|swift-dependencies|swinject|needle|direct|existing|n/a"
    routes:
      default: comment-authoring
    prompt: |
      For each must-fix finding in final-review.md or gate-results.json, apply
      the change. After QA failures, return through review before running gates
      again. Follow the runner's printed next_command for each fix/review
      loop. Resolve required skills from active profile metadata, installed
      skill index, changed files, and task scope before writing or judging code.
      Apply `skills/clean-architecture/SKILL.md` to any boundary-affecting fix.
      Android/Kotlin/Compose/KMP fixes require Android profile skills,
      `android-code-review`, and the skills this phase prompt lists for the
      change; React Native `android/` native fixes also apply Android profile
      mapping. If a required local skill is missing, do not complete this
      artifact; report `missing local <group>: <skill>` with the source URL.
      End with:

          ## Completion Gate
          skills_checked: true
          profile-skill-selection: applied
          active-profiles: <profile list>
          changed-file-skill-resolution: applied
          required-profile-skills: checked
          missing-required-profile-skills: none|<list>
          clean-architecture: applied
          project-local-skills: checked|n/a
          project-local-skills-used: <skill list or n/a>
          presentation-skill: n/a
          presentation-state-based-development: n/a
          presentation-state-review: n/a
          ui-state-modeling: n/a
          presentation-mapping-boundary: n/a
          di-boundary: n/a

      Output: fix-loop.md.

  - id: commit
    skills:
      required: [agent-flow-concise-output]
    required_markers:
      - "commit-oid:"
      - "commit-subject:"
    description: Stage and commit using profile.commit_convention.
    prompt: |
      Group changes into logical commits per profile.commit_convention.style.
      Use agent-flow-concise-output commit rules: Conventional Commit subject
      target 50 chars, hard cap 72 chars, body only when the reason is unclear.
      Do not include co-author trailers unless profile.commit_convention.co_author
      is `include`. Record exactly one full current HEAD OID and its exact
      subject as `commit-oid: <oid>` and `commit-subject: <subject>`.
      Output: commit.md.

  - id: push-pr
    required_markers:
      - "remote:"
      - "branch:"
      - "remote-oid:"
      - "pr-url:"
      - "pr-base:"
    description: Push branch and open PR against profile.pr.target_branch.
    prompt: |
      Push the branch and open a PR against `profile.pr.target_branch`. Body
      references: design and verification results. Record `remote:`, `branch:`,
      the pushed `remote-oid:`, HTTPS `pr-url:`, and the exact profile target as
      `pr-base:`. Output: push-pr.md.

  - id: pr-watch
    skills:
      required: [push-watch]
    description: Watch PR — auto-respond to comments and CI failures.
    routes:
      green: merge
      merged: cleanup
      comments: pr-comment-fix
      has_comments: pr-comment-fix
      ci-failed: pr-ci-fix
      ci_failed: pr-ci-fix
      pending: block
      closed: block
      error: block
      skipped: cleanup
    prompt: |
      Use agent-flow's built-in PR watcher. Read push-pr.md to find the PR
      number, then run:

          agent-flow pr-watch <number>           # poll until actionable
          agent-flow pr-watch <number> --once    # single fetch (debugging)

      The watcher returns a JSON summary with `status` ∈ {green, comments,
      has_comments, ci-failed, ci_failed, pending, merged, skipped, closed,
      error}. `comments` aliases `has_comments`; `ci-failed` aliases
      `ci_failed`.

      Branch on status:

      - **green** → write pr-watch.md noting "all checks green, ready to
        merge". Workflow advances to the merge phase.

      - **has_comments** → for each comment in `review_comments` /
        `issue_comments`:
          * code change requested → make the change in the worktree, commit,
            push. Re-run `agent-flow pr-watch <number>` to confirm.
          * discussion / question → reply in the PR thread without code change.
          * decline (out of scope, conflicting opinion) → reply politely
            explaining why, no code change.
        After the loop, write pr-watch.md with the per-comment resolution.

      - **ci_failed** → for each entry in `failed_checks`:
          * reproduce the failure locally using the project gates
            (profile.gates).
          * fix in the worktree, commit, push.
          * re-run `agent-flow pr-watch <number>`.
        Write pr-watch.md with per-check fix log.

      - **closed** (not merged) → ask the user before proceeding;
        write pr-watch.md noting the closed status.

      - **error** → surface the error message; do not retry until user input.

      Output: pr-watch.md (status, actions taken, references to commits /
      PR comment IDs).

  - id: pr-comment-fix
    skills:
      required: [code-generation-discipline, clean-architecture]
    description: Fix actionable PR comments. Runner routes back to pr-watch.
    routes:
      default: pr-watch
    prompt: |
      Address actionable PR review comments, commit, push, resolve the
      corresponding GitHub review threads, and summarize comment/thread IDs,
      fixes, commits, and resolved thread IDs. Output: pr-comment-fix.md.

  - id: pr-ci-fix
    skills:
      required: [code-generation-discipline, clean-architecture]
    description: Fix failing PR CI. Runner routes back to pr-watch.
    routes:
      default: pr-watch
    prompt: |
      Reproduce failing PR checks locally, fix them, commit, push, and summarize
      failed check names, commands, fixes, and commits. Output: pr-ci-fix.md.

  - id: merge
    skills:
      optional: [resolving-merge-conflicts]
    description: Merge using profile.pr.merge_strategy.
    prompt: |
      Merge via profile.pr.merge_strategy (squash / rebase / merge). If the
      merge or rebase hits conflicts, apply
      `skills/resolving-merge-conflicts/SKILL.md` before completing. Output:
      merge.md (merge commit hash, target branch).

  - id: cleanup
    description: Record cleanup handoff; Runner retires the checkout transactionally.
    prompt: |
      Do not delete the working branch, worktree, runtime metadata, or `active`
      marker. Record the integration target and any Lore-worthy architectural
      decisions, failures, or tradeoffs in cleanup.md. After this artifact is
      accepted, Runner owns the durable archive → integration proof → worktree
      removal → expected-OID branch CAS → metadata cleanup transaction.
      cleanup.md alone is never terminal-completion evidence.
