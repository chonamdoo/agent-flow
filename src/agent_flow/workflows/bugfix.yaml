id: bugfix
description: Reproduce, fix, review, and verify a defect.
completion_disposition: local-handoff
phases:
  - id: reproduce
    description: Reproduce the reported defect and capture the failing behavior.
    prompt: |
      Reproduce the defect. Record exact steps, observed behavior, expected behavior,
      and the smallest failing command or test when available.
      Output: reproduce.md.

  - id: implement-fix
    skills:
      required: [code-generation-discipline]
    description: Fix the reproduced defect with a regression test that ran.
    required_markers:
      - "regression-test:"
      - "red-observed:"
      - "test-run-evidence: verified|unavailable"
    required_markers_by_architecture: {}
    prompt: |
      Fix only the reproduced defect. Keep the change scoped to the failing behavior
      and update or add the narrowest regression test that proves the fix.

      Run that test **before** the fix and watch it fail, then run it again after.
      The runs are observed by the `record-command-run.py` PostToolUse hook, so a
      fix with no test command in this phase is rejected regardless of what you
      record. Fixing the defect without a test that reproduces it is how the same
      bug comes back.
      End with:

          ## Completion Gate
          regression-test: <test id that reproduces the defect>
          red-observed: <exit code of the pre-fix failing run>
          test-run-evidence: verified|unavailable

      Use `test-run-evidence: unavailable` only when the host does not run the
      observation hook.

      Output: implement-fix.md.

  - id: review
    skills:
      required: [code-generation-discipline]
    description: Review the bug fix.
    multi_review: true
    required_markers:
      - "must-avoid-check: pass|fail|n/a"
    required_markers_by_architecture: {}
    routes:
      approve: qa
      request-changes: implement-fix
    prompt: |
      agent-flow already ran the reviewers as confined subprocesses on the
      installed Claude/Codex pool. Do not launch reviewer CLIs yourself:
      aggregate the per-angle artifacts the runner lists. At least two
      independent reviewer processes must cover the reproduced failure, the fix
      scope, regression coverage, and unintended behavior changes.
      Each reviewer section must include `reviewer-source: sub-agent` and an
      independent verdict: approve or request-changes.
      The selected architecture contract reviewer must record `must-avoid-check: pass|fail`;
      a missing or failing marker blocks approval. That angle runs when this
      phase requires an architecture contract — the reviewer list the runner
      printed is the fact. When it is absent, record `must-avoid-check: n/a`. Any request-changes from any
      reviewer makes the overall verdict request-changes.
      End with `## Overall` followed by exactly one verdict line:
      `verdict: approve` or `verdict: request-changes`.
      Output: review.md.

  - id: qa
    description: Verify the fixed defect.
    required_markers:
      - "feedback-command:"
      - "feedback-green-exit:"
      - "feedback-run-evidence: verified|unavailable"
    required_markers_by_architecture: {}
    routes:
      green: handoff
      approve: handoff
      request-changes: implement-fix
      blocked: block
      error: block
      default: block
    prompt: |
      Re-run the reproduction from reproduce.md against the fixed code — the
      smallest failing command or test it recorded — and observe exit 0, then run
      the regression test and the smallest relevant quality checks for the touched
      stack. The command run is observed, so `status: green` needs that exact
      reproduction command observed with exit 0 in this phase; a green status
      without it is rejected. Use `status: request-changes` with the exact failure
      when the defect still reproduces. Use `status: blocked` or `status: error`
      only for an external blocker the code cannot fix (a missing tool, device or
      service), naming it; those stop the run instead of sending the code back.
      For a non-green status, still record the command when known and the
      observed exit or `unavailable`.

      End with:

          ## Completion Gate
          feedback-command: <exact reproduction command>
          feedback-green-exit: 0
          feedback-run-evidence: verified|unavailable

      Output: qa.md.

  - id: handoff
    description: Summarize the defect fix result.
    prompt: |
      Summarize the reproduced defect, fix, verification, and any residual risk.
      Output: handoff.md.
