roles:
  explorer:
    responsibility: Read the codebase and produce scoped context.
  planner:
    responsibility: Convert requirements into ordered implementation steps.
  implementer:
    responsibility: Make the requested code or file changes.
  reviewer:
    responsibility: Find correctness, regression, and test risks.
  qa:
    responsibility: Run gates and report failures with evidence.
  fixer:
    responsibility: Address review or QA failures without expanding scope.

